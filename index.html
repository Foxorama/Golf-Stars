         (its active highlight no longer envelops them). */
      .gs-czone--pants { top: 50%; height: 20%; justify-content: flex-end; align-items: center; }
      .gs-czone--pants::before { inset: 6px 6px 6px 8%; border-radius: 22px; }
      .gs-czone--pants .gs-czone__chip { max-width: 96%; }
      /* The golf-bag prop stands at the figure's left; its tap band owns the lower-LEFT corner and its
         chip sits at the bottom, beside the propped bag (GS-unending). Widened to ~46% so the longer
         earned-bag names no longer truncate to "Evergreen Tou…". */
      .gs-czone--bag   { top: 70%; height: 29%; right: 54%; justify-content: flex-start; align-items: flex-end; padding-bottom: 6px; z-index: 4; }
      .gs-czone--bag::before { inset: 6px 8% 6px 6px; border-radius: 22px; }
      .gs-czone--bag .gs-czone__chip { max-width: 96%; }
      /* The driver (the swung club) mirrors the bag on the figure's RIGHT — lower-right corner, chip at
         the bottom beside the propped club (GS-thor). Same widened band so "Thor's Hammer" reads whole. */
      .gs-czone--driver { top: 70%; height: 29%; left: 54%; justify-content: flex-end; align-items: flex-end; padding-bottom: 6px; z-index: 4; }
      .gs-czone--driver::before { inset: 6px 6px 6px 8%; border-radius: 22px; }
      .gs-czone--driver .gs-czone__chip { max-width: 96%; }
      .gs-czone__chip {
        position: relative; z-index: 4; display: inline-flex; align-items: center; gap: 5px;
        max-width: 47%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font: 700 11.5px/1 var(--gs-font); color: var(--gs-ink);
        padding: 5px 9px; border-radius: 999px;
        background: rgba(10, 12, 18, .84); border: 1px solid var(--gs-line); box-shadow: var(--gs-shadow);
      }
      .gs-czone--active .gs-czone__chip { border-color: var(--gs-warn); color: var(--gs-warn); }
      .gs-czone__pen { opacity: .55; font-weight: 400; }
      .gs-clubset {
        text-align: center; margin: 2px 0 8px; font: 700 12px/1 var(--gs-font); color: #ff4fd8;
      }
      .gs-clubhint { text-align: center; font-size: 12.5px; opacity: .6; margin: 8px 0 4px; }

      /* The garage bay tile — a wide tap target that opens the ride picker. */
      .gs-garage {
        position: relative; display: block; width: 100%; margin: 4px 0 2px; min-height: 130px;
        padding: 0; overflow: hidden; border-radius: var(--gs-r-lg); border: 1px solid #35507a;
        background: var(--gs-bg-2); color: var(--gs-ink); cursor: pointer; box-shadow: var(--gs-shadow);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: transform .14s ease, box-shadow .18s ease, border-color .16s ease, filter .16s ease;
      }
      .gs-garage:hover { transform: translateY(-2px); border-color: #5a7db0; filter: brightness(1.06); box-shadow: 0 8px 22px rgba(0, 0, 0, .5); }
      .gs-garage:active { transform: translateY(0); }
      .gs-garage:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }
      .gs-garage--active { border-color: var(--gs-warn); box-shadow: 0 0 0 1px var(--gs-warn), var(--gs-shadow); }
      .gs-garage__art { position: absolute; inset: 0; display: block; }
      .gs-garage__art svg { display: block; width: 100%; height: 100%; }
      .gs-garage__cap {
        position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end;
        justify-content: space-between; gap: 8px; padding: 26px 12px 11px;
        background: linear-gradient(180deg, transparent, rgba(8, 9, 14, .9) 66%);
      }
      .gs-garage__name { display: block; font: 700 15px/1.15 var(--gs-font); }
      .gs-garage__sub { display: block; font-size: 11.5px; opacity: .78; text-transform: capitalize; }
      .gs-garage__edit {
        flex: none; align-self: flex-end; font: 700 11px/1 var(--gs-font); color: var(--gs-warn);
        padding: 5px 9px; border: 1px solid var(--gs-warn); border-radius: 999px; background: rgba(10, 12, 18, .72);
        white-space: nowrap;
      }

      /* The revealed slot picker (owned rack for the tapped slot). */
      .gs-cpick {
        border: 1px solid var(--gs-warn); border-radius: var(--gs-r-lg);
        background: linear-gradient(180deg, #171a24, var(--gs-bg-2)); margin: 10px 0 4px; padding: 10px 10px 12px;
        animation: gsPickIn .18s ease;
      }
      @keyframes gsPickIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
      .gs-cpick__head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .gs-cpick__title { font: 700 15px/1 var(--gs-font); }
      .gs-cpick__done {
        margin-left: auto; font: 700 12px/1 var(--gs-font); color: var(--gs-dim);
        background: transparent; border: 1px solid var(--gs-line); border-radius: 999px; padding: 5px 11px; cursor: pointer;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: color .16s ease, border-color .16s ease;
      }
      .gs-cpick__done:hover { color: var(--gs-ink); border-color: #46506a; }
      .gs-cpick__rack { display: flex; flex-wrap: wrap; justify-content: center; }
      .gs-cpick__empty { text-align: center; font-size: 12.5px; opacity: .75; padding: 4px 0 8px; }

      /* ── Scorecard table ─────────────────────────────────────────────────── */
      .gs-scorecard { border-collapse: collapse; font-size: 13px; width: 100%; }
      .gs-scorecard th { padding: 2px 8px; opacity: .55; text-align: left; font-weight: 600; }
      .gs-scorecard td { padding: 3px 8px; }
      .gs-scorecard tr[data-action] { cursor: pointer; transition: background .12s ease; }
      .gs-scorecard tr[data-action]:hover { background: #1d212c; }

      /* Interactive play layout (GS-mechanics #3): map + controls side-by-side on wide screens;
         on mobile, a big map with the Hit action bar pinned to the bottom of the viewport so it
         never needs scrolling to reach. */
      .gs-play { display: flex; gap: 18px; align-items: flex-start; }
      .gs-map { flex: 0 1 460px; max-width: 60%; }
      .gs-map svg { display: block; width: 100%; height: auto; touch-action: none; }
      .gs-controls { flex: 1 1 250px; min-width: 230px; }
      @media (max-width: 640px) {
        .gs-play { flex-direction: column; gap: 10px; }
        .gs-map { width: 100%; max-width: 100%; flex: none; display: flex; justify-content: center; }
        .gs-map svg { width: auto; height: auto; max-height: calc(var(--gs-dvh) * .56); max-width: 100%; }
        .gs-controls { width: 100%; }
        .gs-hitbar {
          position: sticky; bottom: 0; z-index: 20; display: flex; gap: 8px;
          background: linear-gradient(180deg, transparent, var(--gs-bg) 28%);
          padding: 10px 0 8px; box-shadow: 0 -10px 16px var(--gs-bg);
        }
        .gs-hitbar .gs-btn { flex: 1; margin: 0; padding: 13px 10px; font-size: 16px; text-align: center; }
      }

      /* Uplifted shot screen (the map IS the screen): a full-height flex column — compact stat
         bar on top, the map filling ALL the leftover space, club/strategy/hit at the bottom.
         Sizing the map as the flex remainder (not a fixed vh) means the controls always fit
         under it without a scroll or an overlapping sticky footer. */
      .gs-shot {
        display: flex; flex-direction: column; gap: 8px;
        /* Fixed to the viewport (not min-height) + overflow-hidden so the play screen NEVER
           scrolls — the map absorbs the slack and the club/aim/Hit controls always sit on
           screen without scrolling down to reach them. The 46px is .gs-main's vertical
           padding (18+28); the safe-area insets are subtracted too since .gs-main now adds
           them to its padding, so the math stays exact on notched phones. */
        height: calc(var(--gs-vh) - 46px);
        height: calc(var(--gs-dvh) - 46px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        overflow: hidden;
      }
      /* The play screen's team/partner sub-line (the only survivor of the old stacked info chip —
         GS-hud-compass replaced the rest with the instrument cluster). */
      .gs-hud-top .gs-sub { font-size: 12.5px; opacity: .9; line-height: 1.35; margin-top: 4px; }
      /* The lie is the player's most decision-relevant fact — a bordered, colour-coded chip
         (green ok / amber caution / red trouble) right in the sub-line, with its carry+spray hit. */
      .gs-liechip {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 12.5px; padding: 2px 8px; border-radius: 999px;
        border: 1px solid currentColor; white-space: nowrap;
      }
      /* Momentum rail — one pip per hole, coloured by score; current ringed, upcoming dim. */
      .gs-pips { display: flex; gap: 3px; align-items: center; margin-top: 4px; }
      .gs-pip {
        width: 8px; height: 8px; border-radius: 2.5px; flex: 0 0 auto;
        background: #2a3142; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
      }
      .gs-pip--cur { box-shadow: 0 0 0 2px var(--gs-info); background: #3a4356; }
      .gs-bigmap {
        /* min-height:0 lets the map shrink to whatever the topbar + controls leave, so the
           controls never get pushed below the fold. position:relative anchors the nav overlay. */
        flex: 1 1 0; min-height: 0; position: relative;
        display: flex; justify-content: center; align-items: center;
        border: 1px solid var(--gs-line); border-radius: var(--gs-r);
        overflow: hidden; box-shadow: var(--gs-shadow); touch-action: none;
      }
      .gs-bigmap svg { display: block; height: 100%; width: 100%; touch-action: none; }
      .gs-bigmap canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
      /* Map navigation overlay — floats on the map (top-right) so it needs no scrolling. */
      .gs-mapctrl {
        position: absolute; top: 8px; right: 8px; z-index: 5;
        display: flex; flex-direction: column; gap: 6px;
      }
      .gs-mapbtn {
        width: 38px; height: 38px; padding: 0; margin: 0;
        font: 600 17px/1 var(--gs-font);
        display: flex; align-items: center; justify-content: center;
        border-radius: 9px; border: 1px solid var(--gs-line);
        background: rgba(17, 20, 27, .82); color: var(--gs-ink);
        cursor: pointer; -webkit-tap-highlight-color: transparent;
        touch-action: manipulation; user-select: none; -webkit-user-select: none;
        backdrop-filter: blur(2px);
        transition: filter .14s ease, border-color .14s ease, background .14s ease;
      }
      .gs-mapbtn:hover { filter: brightness(1.18); border-color: #46506a; }
      .gs-mapbtn:active { filter: brightness(.95); }
      .gs-mapbtn[disabled] { opacity: .4; cursor: default; filter: none; }
      .gs-mapbtn--on {
        border-color: var(--gs-accent); background: rgba(29, 74, 42, .9);
        box-shadow: 0 0 10px rgba(95, 212, 90, .25);
      }
      .gs-bottom { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px; }
      .gs-ctrlrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      /* Segmented aim control — one connected row of equal-width options (replaces three
         wrapping buttons). The active segment is the green selected-toggle. */
      .gs-seg {
        display: flex; width: 100%; border: 1px solid var(--gs-line);
        border-radius: var(--gs-r); overflow: hidden; background: #14171f;
      }
      .gs-segbtn {
        flex: 1; padding: 11px 6px; font: 600 14px/1 var(--gs-font);
        background: transparent; color: var(--gs-dim); border: none;
        border-left: 1px solid var(--gs-line); cursor: pointer;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
        transition: background .14s ease, color .14s ease;
      }
      .gs-segbtn:first-child { border-left: none; }
      .gs-segbtn:active { background: #ffffff08; }
      .gs-segbtn--on {
        background: linear-gradient(180deg, #1d4a2a, #163a20); color: #ecffe9;
        box-shadow: inset 0 0 12px rgba(95, 212, 90, .18);
      }
      .gs-legend { font-size: 12px; margin: 1px 0; line-height: 1.45; opacity: .92; }
      /* Pull-to-power HUD (GS-power): a horizontal bar that fills as you drag DOWN on the map to
         charge power; the 100% tick marks a full swing (the bar can run past it with Overdrive). */
      .gs-power { margin: 1px 0 0; }
      .gs-powerbar {
        position: relative; height: 9px; border-radius: 5px; overflow: hidden;
        background: #14171f; border: 1px solid var(--gs-line);
      }
      .gs-powerfill {
        position: absolute; left: 0; top: 0; bottom: 0; width: 0;
        border-radius: 5px 0 0 5px; transition: width .04s linear, background .1s linear;
      }
      .gs-power100 {
        position: absolute; top: -2px; bottom: -2px; width: 2px; transform: translateX(-1px);
        background: rgba(255,255,255,.5); pointer-events: none;
      }
      .gs-powerlabel { font-size: 12.5px; margin-top: 2px; line-height: 1.3; }
      /* The map absorbs the pull gesture, so its touches are never page scrolls/zooms. */
      .gs-shot .gs-bigmap[data-map] { touch-action: none; }
      .gs-shot .gs-hitbar { display: flex; gap: 8px; }

      /* ===== Full-bleed immersive hole screen (GS-fullmap) =====================
         The hole map fills the WHOLE screen; every control + readout floats ON it as a
         translucent overlay, so nothing competes with the map for space. The page frame
         (.gs-main) drops its padding for this screen via .gs-main--bleed. */
      .gs-main--bleed { padding: 0; max-width: none; }
      /* THE PLAY SCREEN KEEPS A PORTRAIT FRAME WHEREVER IT IS NOT PHONE-PORTRAIT
         (GS-play-desktop-frame). `mapFrame()` grows the 360×640 design frame to the CONTAINER's
         aspect (GS-play-fullframe) so the map never letterboxes — exactly right on a phone, and
         exactly wrong on a desktop, where a wide container yields a wide camera and every shot
         reads as over-zoomed. Capping the container is the whole fix: the camera then frames the
         same shot it frames on a phone.

         Keyed on ASPECT, never width. A phone held in landscape is as wrong for a portrait-tuned
         camera as a 1440px monitor is, and a width query cannot tell those apart. The threshold
         sits above the squarest real phone in portrait (iPhone SE, 0.5625) so every portrait phone
         — and the 390×844 the browser layout tests run at — is untouched, byte-for-byte.

         Safe because the play screen is SELF-CONTAINED: `.gs-shot--full` is `position: relative`
         and `.gs-bigmap`/`.gs-hud` are `position: absolute` INSIDE it, so capping this one
         container carries the map, the HUD and the controls with it. Nothing on this screen is
         fixed to the viewport, so nothing can fall out of step with the frame. */
      @media (min-aspect-ratio: 3 / 4) {
        .gs-main--bleed { max-width: var(--gs-portrait-w); margin-inline: auto; }
        /* …AND THE STAR CHART, which used to escape it (GS-startour-frame).
           `.gs-startour` is `position: fixed; inset: 0`, so capping its `.gs-main--bleed` parent did
           nothing to it: coming off a 600px-wide portrait hole you landed on a 1920px-wide chart,
           which is a jarring change of format mid-run and left the mobile-composed HUD stranded —
           tiny buttons flung to opposite corners of the display, planets lost in the middle.
           `inset: 0` already pins left AND right, so a definite width plus `margin-inline: auto`
           centres it with no transform (which would have made every fixed descendant position
           against this box instead of the viewport). The whole HUD is a CHILD of `.gs-startour`, so
           it comes along for free — there is nothing else to bound.
           This is the mobile-first call, taken deliberately: an expanded desktop chart does read
           better once its chrome is designed for the room, and that is a bigger piece of work than
           a frame. Revisit when desktop players ask, not before. */
        .gs-startour { width: var(--gs-portrait-w); margin-inline: auto; }
      }
      .gs-main--wide { max-width: 1180px; }
      /* Character-select locks to the viewport on phones (GS-select-onescreen): the page frame becomes a
         flex column of exactly one screen height, so the roster grid inside fills the space under the
         header and the whole roster fits with no scroll. Desktop keeps the natural scrolling frame. */
      @media (max-width: 999px) {
        .gs-main--fit { height: var(--gs-vh); height: var(--gs-dvh); overflow: hidden; display: flex; flex-direction: column; }
      }
      .gs-shot--full {
        position: relative; width: 100%;
        height: var(--gs-vh); height: var(--gs-dvh); overflow: hidden;
        display: block; gap: 0;
      }
      .gs-shot--full .gs-bigmap {
        position: absolute; inset: 0; border: none; border-radius: 0; box-shadow: none;
      }
      /* SAFE AREA on the full-bleed play screen (GS-play-safearea). `.gs-bigmap` here is
         `inset: 0` — it deliberately covers the WHOLE viewport, status bar and gesture bar
         included — so anything positioned against its edges lands UNDERNEATH the system UI.
         The map/zoom/settings column was `top: 8px` and sat beneath the Pixel's status bar,
         where the OS eats the taps: the button was visible but could not be pressed.
         Scoped to `--full` on purpose. Outside full-bleed, `.gs-bigmap` lives inside
         `.gs-main`, which already pads by the same insets — applying them here too would
         double-count and push the column into the map. */
      .gs-shot--full .gs-mapctrl {
        top: calc(8px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right));
      }
      /* Overlays float above the map. Most are pass-through (pointer-events:none) so a pull
         can START anywhere on the map even under a readout; only real buttons capture taps. */
      .gs-hud { position: absolute; z-index: 6; pointer-events: none; }
      .gs-hud button, .gs-hud [data-action] { pointer-events: auto; }
      /* The putt-meter canvas is tapped to set pace, so it must capture pointers. */
      .gs-hud #puttmeter, .gs-hud #puttmeter canvas { pointer-events: auto; }
      /* The caddy badge stays pass-through so a power pull can START over it (it's only a portrait). */
      .gs-caddybadge, .gs-caddybadge canvas { pointer-events: none; }
      .gs-glass {
        background: rgba(10, 13, 19, .62); backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
        border: 1px solid rgba(255,255,255,.08); border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0,0,0,.35);
      }
      /* Top-left info chip — hole/par/distance/score + a thin lie·wind sub-line + pips. Kept tight
         (small padding/gaps) so it occludes as little of the shot-range cone behind it as possible. */
      .gs-hud-top {
        top: calc(8px + env(safe-area-inset-top)); left: 8px;
        right: 56px; /* clear the top-right nav column */
        padding: 5px 10px 6px;
      }
      /* ── The INSTRUMENT CLUSTER (GS-hud-compass) ──────────────────────────────────────────────
         The bar was a stack of up to six independently-wrapping rows saying overlapping things. It
         is now one row: the wind COMPASS anchored left, and the readouts as centred PODS — a big
         value over a small all-caps caption, one shape for every number on the bar — with the lie +
         placing on a line under them. Each pod carries a `min-width` so the cluster is pixel-
         identical between aiming and watching (GS-hud-frame's no-reflow rule), which is the job the
         old `.gs-hud-dist` floor used to do for the yardage alone. */
      .gs-hudx { position: relative; min-height: 52px; padding-left: 58px; }
      .gs-hudx__compass {
        position: absolute; left: 0; top: 0; width: 52px; height: 52px;
      }
      /* The active sky's badge, on the dial it belongs to — the weather used to be readable only on
         the route card you flew in on. */
      .gs-hudx__sky {
        position: absolute; right: -2px; bottom: -1px; font-size: 14px; line-height: 1;
        filter: drop-shadow(0 1px 2px rgba(0,0,0,.7));
      }
      .gs-hudx__pods {
        display: flex; align-items: flex-start; justify-content: center;
        gap: 4px 10px; flex-wrap: wrap;
      }
      .gs-hudx__pod {
        display: flex; flex-direction: column; align-items: center; min-width: 54px;
        line-height: 1.05; text-align: center;
      }
      /* Hairline dividers between pods — the dashboard read. They ride the pod itself (not a gap
         element) so a wrap can never leave a rule hanging on its own. */
      .gs-hudx__pod + .gs-hudx__pod { border-left: 1px solid rgba(255,255,255,.1); padding-left: 10px; }
      .gs-hudx__pod > b { font-size: 19px; font-weight: 800; color: var(--gs-ink); }
      .gs-hudx__pod > span {
        font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
        color: var(--gs-dim); margin-top: 3px; white-space: nowrap;
      }
      /* The live yardage is the number the whole screen is about — one step bigger than its
         neighbours, and wide enough that "—" while the ball is in the air cannot shrink the row. */
      /* FIXED, not just a floor: the hero pod's caption changes with the play state ("y to pin" while
         aiming, "in air" mid-flight), and a pod that could GROW pushed the score pod onto a second row
         the instant a shot was struck — the exact reflow GS-hud-frame exists to forbid. */
      .gs-hudx__pod--hero { flex: 0 0 74px; min-width: 74px; }
      .gs-hudx__pod--hero > b { font-size: 25px; color: #eef3fb; }
      .gs-hudx__lie {
        display: flex; align-items: center; justify-content: center; gap: 7px; flex-wrap: wrap;
        font-size: 12.5px; margin-top: 4px; min-height: 19px;
      }
      .gs-hudx__place { color: var(--gs-dim); white-space: nowrap; }
      /* ── The persistent play frame's ACTION ZONE (GS-hud-frame) ──────────────────────────────
         One skeleton for all six play states: caddy slot · controls panel · action column, bottom-
         anchored so the thumb-critical row (commit button · caddy · auto-finish) lands at the same
         y whether you're aiming, watching, chipping or putting. Only the CONTENTS change. */
      .gs-hud-bottom {
        left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom));
        /* flex-end (not stretch) so the caddy badge + round button sit at their NATURAL height,
           bottom-aligned to the controls panel — the badge no longer stretches tall to match the
           controls column (the "caddy frame too tall for the graphic" bug). */
        display: flex; align-items: flex-end; gap: 6px;
      }
      /* The caddy's PERMANENT slot — a fixed cell present in every state, so the bar's left edge
         never jumps (the badge used to ride the aim screen only, and only a putting specialist on
         the green). Fixed width whether or not a caddy is hired.
         GS-play-hud-space: 78px → 66px. The flanking columns cost the controls panel a THIRD of the
         screen width (78 caddy + 40 button + gaps of 390), which is what wrapped the power read and
         the spray legend onto second lines — vertical height spent to buy horizontal emptiness. The
         badge keeps its frame, glow and rotating sheen; it is 15% smaller, not demoted. */
      .gs-hud-caddy { flex: 0 0 66px; width: 66px; display: flex; flex-direction: column; }
      .gs-hud-caddy .gs-caddybadge { width: 100%; }
      /* On the bag but with no read on this shot (a distance/guard caddy on the green): the portrait
         dims and stops glowing rather than disappearing. */
      .gs-hud-caddy--off .gs-caddybadge { opacity: .5; animation: none; filter: saturate(.6); }
      .gs-hud-caddy--off .gs-caddybadge::before { animation: none; opacity: .35; }
      /* No caddy hired at all — a quiet placeholder holding the same box, so the frame is identical
         and the empty slot quietly advertises the hire. */
      .gs-hud-caddy--empty {
        align-items: center; justify-content: center; gap: 3px;
        height: 66px; border-radius: 15px; opacity: .38;
        border: 1.5px dashed rgba(255, 220, 120, .38);
        background: rgba(10, 13, 19, .5);
      }
      .gs-hud-caddy--empty .gs-hud-caddyglyph { font-size: 22px; line-height: 1; }
      .gs-hud-caddy--empty .gs-hud-caddylab {
        font-size: 9.5px; font-weight: 800; letter-spacing: .03em; color: #ffe6a3;
      }
      /* The action column — the auto-finish round button, always present (disabled mid-flight).
         Bottom-aligned at a FIXED size rather than stretched to the panel: the panel's height
         legitimately changes with its contents (a pace meter is taller than a power bar), and a
         stretched button would ride up and down with it. A fixed button also keeps auto-finish the
         smaller target — a fat-finger tap should land on the commit button, not on skipping the hole. */
      .gs-hud-actions { flex: 0 0 auto; position: relative; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; gap: 6px; }
      /* ── The BAG + its floating stack (GS-hud-bag) ────────────────────────────────────────────
         The bag is the bottom-right anchor of the play screen — one tap opens the whole bag. Only
         the bag is IN FLOW: `.gs-hud-bottom`'s height is what the camera measures as the map's clear
         band (GS-play-hud-space), and a three-button column in flow would be 170px deep, i.e. as
         deep as the control panel this feature exists to delete. So aim/auto-finish (and the
         conditional 🎯) float ABOVE the bag, over the map, and the bar stays one badge tall. */
      .gs-hud-actionstack {
        position: absolute; right: 0; bottom: 100%; margin-bottom: 6px;
        display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
      }
      .gs-hud-bagbtn {
        flex: 0 0 auto; width: 56px; height: 66px; padding: 4px 0 3px;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 1px;
        border-radius: 14px; cursor: pointer; color: var(--gs-ink);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        user-select: none; -webkit-user-select: none;
        transition: filter .14s ease, border-color .14s ease;
      }
      .gs-hud-bagbtn:hover { filter: brightness(1.14); }
      .gs-hud-bagbtn:active { filter: brightness(.92); }
      .gs-hud-bagbtn[disabled] { opacity: .42; cursor: default; filter: none; }
      .gs-hud-bagart { width: 40px; height: 46px; flex: 0 0 auto; }
      .gs-hud-bagclub {
        font: 800 12px/1 var(--gs-font); letter-spacing: .02em; color: var(--gs-ink);
        max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      /* The aim-mode button reads "engaged" the same way the map-nav toggle does — an aim other than
         the default auto assist is a choice the player made and should be able to see at a glance. */
      .gs-roundbtn--on {
        border-color: var(--gs-accent); background: rgba(29, 74, 42, .9);
        box-shadow: 0 0 10px rgba(95, 212, 90, .25);
      }
      /* The commit row is the panel's LAST child, so the primary action button sits at the same
         height in every state even though the rows above it differ (a pace meter is taller than a
         power bar). Margin-top pushes it to the panel's floor when the rows are short. */
      .gs-hud-commit { margin-top: auto; }
      .gs-hud-commit .gs-btn { margin: 0; padding: 11px; width: 100%; font-size: 15px; }
      /* Watch-screen caddy badge — the framed gold portrait floats bottom-RIGHT during the shot
         animation (GS-caddy-display), clear of the play view's bottom-left corner caddy + the
         top-left info chip, so the "premium hire" border reads the whole shot. */
      .gs-hud-watchcaddy {
        right: 8px; bottom: calc(8px + env(safe-area-inset-bottom));
        display: flex; align-items: flex-end;
      }
      /* The controls panel. `min-height` makes the aim / chip / watch states pixel-identical to each
         other (with or without Sam's extra read line); the putt state is genuinely taller because a
         pace meter is, and the bottom-anchored commit row absorbs the difference. */
      .gs-hud-controls {
        flex: 1 1 auto; min-width: 0; padding: 6px 9px 6px; min-height: 118px;
        display: flex; flex-direction: column; gap: 4px;
      }
      /* SLIM: the aim + watch states have no rows left (GS-hud-bag) — the club moved to the bag, the
         aim mode to its own button, and the power onto the commit button itself. With nothing above
         it the glass frame is just a box drawn around a button, so the panel dissolves and the pill
         IS the panel. The putt state keeps the full panel: its pace meter and break read are the only
         readouts on the play screen the map does not already draw. */
      .gs-hud-controls--slim {
        min-height: 0; padding: 0; background: none; border: none;
        box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
      }
      /* The commit button carries the live pull power as a fill behind its own label, so the charge
         has a bar and a number without a second row to put them on. The label is absolutely placed
         over the fill, so the button's height is its own (min-height, ≥44px target) and the fill can
         sweep the full width. */
      .gs-swing { position: relative; overflow: hidden; min-height: 46px; }
      .gs-swing__inner {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      }
      .gs-swing__fill {
        position: absolute; left: 0; top: 0; bottom: 0; width: 0; opacity: .38;
        transition: width .04s linear, background .1s linear;
      }
      .gs-swing__tick {
        position: absolute; top: 0; bottom: 0; width: 2px; transform: translateX(-1px);
        background: rgba(255, 255, 255, .55); pointer-events: none;
      }
      .gs-swing__lab {
        position: relative; z-index: 1; padding: 0 8px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      /* ── The PUTT panel (GS-putt-panel) ────────────────────────────────────────────────────────
         The putt is the one play state that keeps a full control panel — its pace meter and break
         read are the only readouts on the screen the map does not already draw (GS-hud-bag). But it
         kept the chrome of a screen that no longer exists: `.gs-clubrow`'s two heavy dark slabs
         around a sentence (built for the club cycler the bag replaced), a flat hard-cornered canvas,
         and three lines of prose re-teaching the controls every putt. Beside an instrument-cluster
         top bar and a one-pill commit row it read as a different game's UI.
         So the panel speaks the frame's language: a POD for the value (the cluster's one shape for
         every number — big value, small all-caps caption), quiet nudges that are controls rather
         than slabs, and the note line dropped to a caption. `.gs-putt*` is its own namespace inside
         the play screen's `.gs-hud*` frame — never another screen's (the #353 regression). */
      .gs-puttrow { display: flex; align-items: stretch; gap: 5px; }
      /* The aim nudges. Same visual weight as the map-nav/aim-mode round buttons, not the commit
         button — a nudge is a repeatable adjustment, and it should never out-shout ⛳ Putt. Sized to
         clear the 44px touch target at the SHIP scale, before `--gs-uiscale` lifts it further. */
      .gs-puttnudge {
        flex: 0 0 auto; width: 40px; min-height: 44px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        font: 700 15px/1 var(--gs-font); color: var(--gs-ink);
        border-radius: 12px; border: 1px solid rgba(255, 255, 255, .10);
        background: rgba(255, 255, 255, .06); cursor: pointer;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        user-select: none; -webkit-user-select: none;
        transition: filter .14s ease, border-color .14s ease;
      }
      .gs-puttnudge:hover { filter: brightness(1.2); }
      .gs-puttnudge:active { filter: brightness(.9); }
      .gs-puttnudge[disabled] { opacity: .3; cursor: default; filter: none; }
      /* The fringe's chip/putt toggle rides the same row but is not an aim control — narrower, so
         the three buttons together still leave the pod room to print "12.4yd right" unclipped. */
      .gs-puttnudge--alt { width: 36px; font-size: 13px; }
      /* The pod: identical proportions to `.gs-hudx__pod`, so the aim reads as one of the screen's
         instruments rather than as a label. Both halves clip — a big borrow on a wide green prints
         "12.4yd right", and the row must never wrap (GS-hud-frame's no-reflow rule). */
      .gs-puttread {
        flex: 1 1 auto; min-width: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        line-height: 1.05; text-align: center;
      }
      .gs-puttread > b {
        font-size: 16px; font-weight: 800; color: var(--gs-ink);
        max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .gs-puttread > span {
        font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
        color: var(--gs-dim); margin-top: 3px;
        max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      /* The meter mounts at a clamped pixel width (it is a canvas), so centre it in whatever width
         the panel has rather than letting it hang off the left edge. */
      .gs-puttmeter { display: flex; justify-content: center; }
      /* The read, as a caption line: the break the map draws but does not number, plus where the
         read runs out. What it is NOT any more is the instructions. */
      .gs-puttnote {
        font-size: 11.5px; line-height: 1.25; color: var(--gs-dim); text-align: center;
        overflow-wrap: anywhere;
      }
      .gs-puttnote b { color: var(--gs-ink); font-weight: 700; }

      /* ── TIGHT FIT: give the controls panel its width back (GS-a11y-tight-fit) ──────────────────
         GS-play-hud-space already found the shape of this bug and named it: "the flanking caddy/action
         columns cost the controls panel a THIRD of the screen width, which is what wrapped the power
         read and the spray legend onto second lines — vertical height spent to buy horizontal
         emptiness." At the top UI-scale rung it stops being a third and becomes half. The phone lays
         out in 269 units; caddy 66 + action 40 + four gaps leave the panel **135**, and the control
         stack answers by growing from 265 units tall to 380 — the top bar and the bottom bar together
         take 83% of the screen and the player cannot see the ball they are aiming.
         So when — and only when — the room genuinely isn't there, the two flanking blocks stop being
         COLUMNS and become badges floating just above the panel, over the map. Nothing is removed and
         nothing moves between play states (GS-hud-frame's rule): the caddy is still bottom-left, the
         auto-finish still bottom-right, both at the same size. The panel simply gets the whole width.
         `data-gs-fit` is stamped by `app/viewportFit.ts` because a media query cannot see the root
         zoom (GS-a11y-scale-wrap); at the two lower rungs on a phone it reads "roomy" and the bar the
         player already knows is untouched. */
      :root[data-gs-fit="tight"] .gs-hud-bottom { position: absolute; }
      :root[data-gs-fit="tight"] .gs-hud-bottom > .gs-hud-caddy,
      :root[data-gs-fit="tight"] .gs-hud-bottom > .gs-hud-actions {
        position: absolute; bottom: 100%; margin-bottom: 6px; z-index: 1;
      }
      :root[data-gs-fit="tight"] .gs-hud-bottom > .gs-hud-caddy { left: 0; }
      :root[data-gs-fit="tight"] .gs-hud-bottom > .gs-hud-actions { right: 0; }
      :root[data-gs-fit="tight"] .gs-hud-bottom > .gs-hud-controls { flex: 1 1 100%; }
      /* (The hole's shape/width DESCRIPTORS used to be dropped here at a tight fit. GS-hud-compass
         moved them off the play bar entirely, onto the tee card where briefing belongs, so there is
         nothing left to hide.)
         What the cluster gives up instead, at a tight fit and only there: the arc PLACING, which is
         the one readout on the bar that changes nothing about the shot in front of you — and the pod
         DIVIDERS, which are a row ornament and read as stray marks once the pods have stacked. Fewer
         things at the same size, never the same things smaller. */
      :root[data-gs-fit="tight"] .gs-hudx__place { display: none; }
      :root[data-gs-fit="tight"] .gs-hudx__pod + .gs-hudx__pod { border-left: none; padding-left: 0; }
      /* Caddy badge — the hired caddy, framed so it really stands out (GS-fullmap / GS-caddy-display):
         a glowing gold frame, a warm radial backdrop, and a slow rotating sheen behind the figure +
         a pulsing glow, so it reads as a "premium" hire, not a plain portrait. */
      .gs-caddybadge {
        position: relative; isolation: isolate; overflow: hidden;
        flex: 0 0 auto; width: 66px; padding: 4px 4px 3px;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        border-radius: 15px;
        border: 1.5px solid rgba(255, 220, 120, .8);
        background:
          radial-gradient(120% 85% at 50% 0%, rgba(255,206,92,.26), rgba(255,206,92,0) 62%),
          linear-gradient(180deg, rgba(52,40,16,.9), rgba(11,12,18,.9));
        box-shadow: 0 4px 18px rgba(0,0,0,.45), inset 0 0 16px rgba(255,200,90,.16);
        animation: gs-caddyglow 2.4s ease-in-out infinite;
      }
      /* Rotating gold sheen behind the figure (shows through the transparent canvas). */
      .gs-caddybadge::before {
        content: ''; position: absolute; inset: -45%; z-index: -1; pointer-events: none;
        background: conic-gradient(from 0deg,
          transparent 0deg, transparent 55deg, rgba(255,233,170,.42) 92deg,
          transparent 135deg, transparent 235deg, rgba(255,210,120,.22) 275deg, transparent 320deg);
        animation: gs-caddyspin 5s linear infinite;
      }
      .gs-caddybadge canvas, .gs-caddybadge .gs-caddyname { position: relative; z-index: 1; }
      .gs-caddybadge canvas { display: block; width: 56px; height: 52px; }
      .gs-caddybadge .gs-caddyname {
        font-size: 9.5px; font-weight: 800; letter-spacing: .03em; line-height: 1;
        color: #ffe6a3; margin-top: 1px; max-width: 60px; text-align: center;
        text-shadow: 0 0 6px rgba(255,196,84,.5);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      @keyframes gs-caddyglow {
        0%, 100% { box-shadow: 0 4px 18px rgba(0,0,0,.45), 0 0 0 0 rgba(255,205,90,0), inset 0 0 16px rgba(255,200,90,.16); border-color: rgba(255,214,102,.7); }
        50% { box-shadow: 0 5px 22px rgba(0,0,0,.5), 0 0 20px 2px rgba(255,200,90,.5), inset 0 0 22px rgba(255,212,112,.3); border-color: rgba(255,230,156,.98); }
      }
      @keyframes gs-caddyspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .gs-caddybadge { animation: none; }
        .gs-caddybadge::before { animation: none; }
      }
      /* Floating round action button (auto-finish) tucked by the controls. */
      .gs-roundbtn {
        flex: 0 0 auto; width: 36px; height: 46px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 17px; color: var(--gs-ink);
        border-radius: 12px; cursor: pointer;
      }
      .gs-roundbtn:active { filter: brightness(.9); }
      .gs-roundbtn[disabled] { opacity: .4; cursor: default; filter: none; }
      /* Hit is the dominant target; Auto-finish (a hole-skip) is half the width so a fat-finger
         tap lands on Hit, not on accidentally watching the whole hole auto-play. */
      .gs-shot .gs-hitbar .gs-btn { margin: 0; padding: 13px 10px; font-size: 16px; text-align: center; }
      .gs-shot .gs-hitbar .gs-btn--primary { flex: 2; }
      .gs-shot .gs-hitbar .gs-btn--ghost { flex: 1; }

      /* The club +/- arrows are the most-tapped control in a round — give them a comfortable
         44px-class touch target instead of inheriting the default button padding. */
      .gs-ctrlrow [data-cycle] { min-width: 46px; padding: 11px 8px; font-size: 17px; }

      /* Left-handed mode (GS-lefty): mirror the full-map HUD so the reach-critical chrome falls under
         a LEFT thumb, pairing with the mirrored golfer/caddy/spray-cone on the map. The floating nav
         column (overview/zoom/⚙) moves to the left edge, the top info chip swaps to the right to clear
         it, and the bottom panel reverses so the caddy badge sits right and the round action button
         lands on the left. The club ◄/► arrows are NOT reversed — their glyphs are directional. */
      .gs-shot--lefty .gs-mapctrl { right: auto; left: 8px; }
      .gs-shot--lefty .gs-hud-top { left: 56px; right: 8px; }
      .gs-shot--lefty .gs-hud-bottom { flex-direction: row-reverse; }
      /* …and the bag's floating stack hangs off the column's OTHER edge, so it still sits at the
         screen's outer edge rather than pointing into the middle of the map (GS-hud-bag). */
      .gs-shot--lefty .gs-hud-actionstack { right: auto; left: 0; align-items: flex-start; }
      :root[data-gs-fit="tight"] .gs-shot--lefty .gs-hud-bottom > .gs-hud-caddy { left: auto; right: 0; }
      :root[data-gs-fit="tight"] .gs-shot--lefty .gs-hud-bottom > .gs-hud-actions { right: auto; left: 0; }

      /* Page never scrolls sideways — a fixed-width card a hair wider than a tiny viewport
         clips instead of creating a horizontal-scroll jiggle. */
      html, body { overflow-x: hidden; }

      /* Result-screen replay canvas scales to narrow phones (it mounts at a fixed 340px). */
      .gs-replay { width: min(340px, 86vw); max-width: 100%; }
      .gs-replay canvas { width: 100% !important; height: auto !important; max-width: 100%; }

      /* ── Stop result (post-stop recap) — speaks the SAME rarity-framed panel + stat-tile language
             as the arc/hole intro, so finishing a stop reads as a designed beat (verdict → how you
             scored → your round hole-by-hole → replay → standings), not a plain readout. ── */
      .gs-result { position: relative; display: flex; flex-direction: column; gap: 12px; }
      .gs-result-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
      .gs-result-eyebrow { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--gs-accent); opacity: .85; }
      .gs-result-world { font-size: 21px; font-weight: 800; line-height: 1.1; }
      .gs-result-sub { font-size: 12.5px; opacity: .7; margin-top: 3px; }
      .gs-result-vwrap { text-align: right; flex: 0 0 auto; }
      .gs-result-verdict {
        display: inline-block; font-size: 17px; font-weight: 900; letter-spacing: .04em;
        border: 1px solid; border-radius: 8px; padding: 4px 11px; text-shadow: 0 0 14px currentColor;
      }
      .gs-result-rar { margin-top: 7px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
      .gs-result-stats {
        display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 6px;
        border: 1px solid var(--gs-line-2); border-radius: 12px; background: #0d1016;
      }
      .gs-result-stat { flex: 1 1 0; min-width: 0; text-align: center; }
      .gs-result-stat-v { font-size: 26px; font-weight: 800; line-height: 1; }
      .gs-result-stat-l { font-size: 9.5px; opacity: .55; letter-spacing: .08em; margin-top: 4px; }
      .gs-result-stat-s { font-size: 10px; opacity: .7; margin-top: 2px; }
      .gs-result-secl { font-size: 11px; font-weight: 800; letter-spacing: .08em; opacity: .8; margin: 2px 0 -4px; }
      /* The round, hole by hole — the golf-soul journey of the stop; tap any hole to replay it. */
      .gs-round { display: flex; gap: 6px; overflow-x: auto; padding: 2px; scrollbar-width: thin; }
      .gs-round-hole {
        flex: 1 0 auto; min-width: 56px; display: flex; flex-direction: column; align-items: center; gap: 1px;
        padding: 7px 6px; border: 1px solid var(--hc); border-radius: 10px;
        background: color-mix(in srgb, var(--hc) 12%, transparent);
        color: var(--gs-ink); cursor: pointer; font: inherit; transition: transform .1s ease, filter .14s ease;
      }
      .gs-round-hole:hover { filter: brightness(1.12); }
      .gs-round-hole:active { transform: translateY(1px); }
      .gs-round-hole--sel { box-shadow: 0 0 0 2px var(--hc); background: color-mix(in srgb, var(--hc) 24%, transparent); }
      .gs-round-no { font-size: 9.5px; opacity: .65; letter-spacing: .04em; }
      .gs-round-strokes { font-size: 20px; font-weight: 800; line-height: 1; color: var(--hc); }
      .gs-round-par { font-size: 9px; opacity: .55; }
      .gs-round-name { font-size: 10px; font-weight: 800; color: var(--hc); }
      .gs-result-replay { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .gs-result-replay-ctl { display: flex; align-items: center; gap: 10px; font-size: 12px; opacity: .7; }
      .gs-result-continue .gs-btn { width: 100%; text-align: center; font-size: 16px; padding: 13px 16px; }
      /* Top continue CTA (right of the verdict) — reach the shop without scrolling; compact so it
         doesn't crowd the verdict badge on a phone. */
      .gs-result-continue--top { margin-top: 8px; }
      .gs-result-continue--top .gs-btn { width: auto; font-size: 13px; padding: 8px 13px; white-space: nowrap; }

      /* ── Settings sheet (bottom-sheet on mobile, centered card on desktop) ─────────── */
      .gs-sheet-backdrop {
        position: fixed; inset: 0; z-index: 60; display: flex;
        align-items: flex-end; justify-content: center;
        background: rgba(5, 7, 11, .6); backdrop-filter: blur(2px);
        padding: 0 0 env(safe-area-inset-bottom);
      }
      .gs-sheet {
        width: 100%; max-width: 460px;
        background: linear-gradient(180deg, #141823, var(--gs-bg-2));
        border: 1px solid var(--gs-line); border-bottom: none;
        border-radius: var(--gs-r-lg) var(--gs-r-lg) 0 0;
        padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
        box-shadow: 0 -12px 40px rgba(0, 0, 0, .55);
        animation: gs-sheet-up .18s ease;
        /* A SHEET IS BOTTOM-ANCHORED, SO A SHEET TALLER THAN THE SCREEN LOSES ITS TOP — AND A
           `position: fixed` box cannot be reached by scrolling the page (GS-a11y-sheet-scroll).
           At the top UI-scale rung the settings sheet measures ~1515px against an 844px phone:
           everything above "Save data" was off-screen and unrecoverable, which made the scale
           control itself a one-way trip. Cap to the viewport (in the scale-corrected token, never
           raw dvh) and scroll INSIDE instead. `overscroll-behavior: contain` stops a flick at the
           end of the list from scrolling the page behind the backdrop. */
        max-height: calc(var(--gs-vh) - 12px);
        max-height: calc(var(--gs-dvh) - 12px - env(safe-area-inset-top));
        overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }
      .gs-sheet::-webkit-scrollbar { width: 5px; }
      .gs-sheet::-webkit-scrollbar-thumb { background: var(--gs-line); border-radius: 3px; }
      /* The head stays put while the body scrolls, so the title + ✕ are always reachable — the ✕ is
         the only affordance that says "this is dismissible" once the list is long enough to scroll. */
      .gs-sheet > .gs-sheet-head {
        position: sticky; top: -14px; z-index: 2; margin: -14px -16px 8px; padding: 14px 16px 8px;
        background: linear-gradient(180deg, #141823 78%, #14182300);
      }
      @keyframes gs-sheet-up { from { transform: translateY(18px); opacity: .4; } to { transform: none; opacity: 1; } }
      @media (min-width: 560px) {
        .gs-sheet-backdrop { align-items: safe center; }
        .gs-sheet { border: 1px solid var(--gs-line); border-radius: var(--gs-r-lg); }
      }
      .gs-sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      /* ── The club picker (GS-hud-bag) ─────────────────────────────────────────────────────────
         The whole bag as one grid of big tap targets, behind the play screen's bag button. Reuses
         the settings sheet's chrome, so it inherits the safe-area/scroll/`safe center` rules and the
         dialog+focus pass; only the rows are new. `auto-fit` + `minmax(min(…, 100%), 1fr)` so it is
         two columns on a phone, more on a tablet, and one when the UI scale is cranked — never a
         breakpoint, which cannot see the root zoom (GS-a11y-scale-wrap). */
      .gs-clubpick__read { font-size: 13px; line-height: 1.45; color: var(--gs-dim); margin: 0 0 10px; }
      .gs-clubpick__grid {
        display: grid; gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr));
      }
      .gs-clubpick__club {
        position: relative; display: flex; align-items: center; gap: 9px;
        min-height: 52px; padding: 10px 11px; min-width: 0;
        border: 1px solid var(--gs-line); border-radius: 12px; background: #14171f;
        color: var(--gs-ink); text-align: left; cursor: pointer;
        font: 600 15px/1.2 var(--gs-font);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: border-color .14s ease, background .14s ease;
      }
      .gs-clubpick__club:active { filter: brightness(.93); }
      .gs-clubpick__club--on {
        border-color: var(--gs-accent); background: linear-gradient(180deg, #1d4a2a, #163a20);
        box-shadow: inset 0 0 12px rgba(95, 212, 90, .18);
      }
      .gs-clubpick__club--putt { border-color: rgba(159, 216, 230, .5); }
      .gs-clubpick__glyph {
        flex: 0 0 26px; width: 26px; height: 26px; font-size: 18px;
        display: flex; align-items: center; justify-content: center;
      }
      .gs-clubpick__name { flex: 1 1 auto; min-width: 0; font-size: 14.5px; overflow-wrap: anywhere; }
      .gs-clubpick__carry { flex: 0 0 auto; font-size: 13px; font-weight: 800; color: var(--gs-dim); }
      .gs-clubpick__club--on .gs-clubpick__carry { color: #ecffe9; }
      .gs-clubpick__star { position: absolute; top: 3px; right: 5px; font-size: 11px; color: #ffd24a; }
      .gs-setrow {
        display: flex; align-items: center; justify-content: space-between; gap: 14px;
        width: 100%; text-align: left; cursor: pointer;
        background: transparent; border: none; border-top: 1px solid var(--gs-line-2);
        padding: 12px 2px; color: var(--gs-ink);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      }
      .gs-setrow:active { background: #ffffff06; }
      .gs-setlabel b { font-size: 14.5px; }
      .gs-setlabel span { display: block; font-size: 12px; opacity: .6; margin-top: 1px; }
      .gs-toggle {
        flex: 0 0 auto; width: 46px; height: 27px; border-radius: 999px;
        background: #2a3142; border: 1px solid #3a4356; position: relative;
        transition: background .16s ease, border-color .16s ease;
      }
      .gs-toggle .gs-knob {
        position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%;
        background: #c8cdd8; transition: transform .16s ease, background .16s ease;
      }
      .gs-toggle--on { background: #1f5e2d; border-color: var(--gs-accent); }
      .gs-toggle--on .gs-knob { transform: translateX(19px); background: #ecffe9; }
      /* Compact icon on/off toggle CHIPS (GS-settings-chips) — Audio + Feel prefs bundled two-per-row
         so they take a fraction of the height the old full-width rows did. Each is a real switch. */
      /* `1fr` carries an automatic MIN-CONTENT minimum, so a track whose chip cannot shrink any
         further pushes the whole grid wider than the sheet — which is how "Music", "Fast shots" and
         "Readable text" ended up hanging off the right edge at a large UI scale. `auto-fit` +
         `minmax(min(…))` fixes both halves at once: the track can always shrink to the container, and
         when two chips no longer fit side by side the grid drops to one column ON ITS OWN — a
         `max-width` breakpoint could not, because it cannot see `--gs-uiscale` (GS-a11y-scale-wrap).
         At the ship scale two columns still fit on every phone, so the sheet is unchanged. */
      .gs-chipgrid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr));
        gap: 8px; margin-top: 9px;
      }
      .gs-setchip {
        display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
        padding: 10px 11px; border-radius: var(--gs-r); cursor: pointer; color: var(--gs-dim);
        background: #1b2130; border: 1px solid var(--gs-line);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: background .14s ease, border-color .14s ease, color .14s ease;
      }
      .gs-setchip:active { background: #ffffff0d; }
      .gs-setchip-i { font-size: 18px; line-height: 1; flex: 0 0 auto; }
      /* WRAP, don't ellipsis: "Reduced motion" and "Readable text" are the two longest labels in the
         sheet and the two that matter most to the player this feature is for — "Reduced …" is not a
         label. Two lines cost 17px; a truncated accessibility toggle costs the setting. */
      .gs-setchip-t { font-size: 13px; font-weight: 700; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
      .gs-setchip-sw {
        flex: 0 0 auto; width: 30px; height: 18px; border-radius: 999px;
        background: #2a3142; border: 1px solid #3a4356; position: relative;
        transition: background .16s ease, border-color .16s ease;
      }
      .gs-setchip-sw::after {
        content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
        background: #c8cdd8; transition: transform .16s ease, background .16s ease;
      }
      .gs-setchip--on { background: #17331f; border-color: var(--gs-accent); color: var(--gs-ink); }
      .gs-setchip--on .gs-setchip-sw { background: #1f5e2d; border-color: var(--gs-accent); }
      .gs-setchip--on .gs-setchip-sw::after { transform: translateX(12px); background: #ecffe9; }
      /* Settings sheet sections + segmented aim control (GS-default-aim) */
      .gs-setsec {
        font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
        color: var(--gs-dim); margin: 15px 2px 1px;
      }
      .gs-setsec:first-of-type { margin-top: 4px; }
      .gs-setnote { font-size: 12px; opacity: .62; margin: 4px 2px 0; line-height: 1.4; }
      .gs-segctl { display: flex; gap: 7px; margin-top: 9px; }
      .gs-seg {
        flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
        padding: 11px 4px; border-radius: var(--gs-r); cursor: pointer; color: var(--gs-dim);
        background: #1b2130; border: 1px solid var(--gs-line);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: background .14s ease, border-color .14s ease, color .14s ease;
      }
      .gs-seg:active { background: #ffffff0d; }
      .gs-seg-i { font-size: 20px; line-height: 1; }
      .gs-seg-t { font-size: 12.5px; font-weight: 700; }
      .gs-seg--on {
        background: #17331f; border-color: var(--gs-accent); color: var(--gs-ink);
        box-shadow: inset 0 0 0 1px var(--gs-accent);
      }
      .gs-seghint { font-size: 12px; opacity: .7; margin: 8px 2px 0; min-height: 15px; line-height: 1.4; }
      .gs-setfoot { margin-top: 16px; padding-top: 4px; border-top: 1px solid var(--gs-line); }
      .gs-setrow--nav { border-top: none; }
      /* …but a SECOND exit row needs the divider back, or the two run together. */
      .gs-setfoot .gs-setrow--nav + .gs-setrow--nav { border-top: 1px solid var(--gs-line-2); }
      /* The give-it-up exit (GS-leave-round) stands above Return to title and must not read as its
         twin — one parks the round, the other throws it away. A warm LABEL is the whole distinction:
         the row itself stays quiet, because a loud destructive control invites the tap it exists to
         make deliberate. (The confirm card behind it is where the weight belongs.) */
      .gs-setrow--leave .gs-setlabel b { color: #ffc4b8; }
      /* An anchor used as a settings control needs the two things a <button> brings for free:
         no underline, and `box-sizing` on a flex row it does not otherwise inherit. */
      .gs-setrow--link { text-decoration: none; box-sizing: border-box; }
      .gs-setdone { text-align: center; margin-top: 14px; }
      /* ── The More section's ACTION TILES (GS-settings-more) ─────────────────────────────
         Places you go / things you do, two per row: the guide link and the Save data panel,
         where the sheet used to stack a section heading, a paragraph, a storage line, three
         buttons and a nudge under the controls the player actually came to change. Same
         `auto-fit` + `minmax(min(…))` grid as `.gs-chipgrid`, and for the same reason — it
         drops to one column on its own at a large UI scale, which no media query could decide
         (GS-a11y-scale-wrap). Anything that has to state a CONSEQUENCE stays a full-width
         `.gs-setrow` in the footer below; a tile's sub-line is a hint, not a promise. */
      .gs-actgrid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(min(158px, 100%), 1fr));
        gap: 8px; margin-top: 9px;
      }
      .gs-setact {
        display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
        padding: 11px 12px; border-radius: var(--gs-r); cursor: pointer; color: var(--gs-ink);
        background: #1b2130; border: 1px solid var(--gs-line);
        text-decoration: none; box-sizing: border-box;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: background .14s ease, border-color .14s ease;
      }
      .gs-setact:active { background: #ffffff0d; }
      .gs-setact-i { font-size: 19px; line-height: 1; flex: 0 0 auto; }
      .gs-setact-t { flex: 1 1 auto; min-width: 0; }
      .gs-setact-t b { display: block; font-size: 13.5px; font-weight: 800; overflow-wrap: anywhere; }
      .gs-setact-t span { display: block; font-size: 11.5px; opacity: .6; margin-top: 1px; line-height: 1.35; overflow-wrap: anywhere; }
      .gs-setact-x { flex: 0 0 auto; font-size: 13px; opacity: .55; }

      /* ── Save export / import (GS-save-transfer) ───────────────────────────────────────
         Lives inside the settings sheet, so it borrows `.gs-setsec`/`.gs-setnote`/`.gs-btn`
         and adds only what it genuinely needs. Own `gs-save*` names — not the play HUD's
         `.gs-hud`, per the global-class rule. */
      .gs-saverow { display: flex; gap: 8px; margin-top: 8px; }
      .gs-saverow .gs-btn { flex: 1; margin: 0; padding: 11px 8px; font-size: 13.5px; }
      /* The import CONFIRM card — deliberately heavier than the rest of the sheet: it is the last
         thing between a tap and an irreversible overwrite, so it should read as a stop, not a step. */
      .gs-savebox {
        margin-top: 8px; padding: 11px 12px 12px;
        border: 1px solid var(--gs-line); border-radius: var(--gs-r);
        background: #12151d;
      }
      .gs-savebox-h { font-weight: 800; font-size: 14.5px; margin-bottom: 4px; }
      .gs-savelist { list-style: none; margin: 8px 0; padding: 0; font-size: 13px; line-height: 1.6; }
      .gs-savelist li { opacity: .9; }
      .gs-savewarn {
        margin: 10px 0 2px; padding: 8px 10px; border-radius: 9px;
        font-size: 12px; line-height: 1.45;
        color: #ffd0c4; background: rgba(179, 64, 47, .18);
        border: 1px solid rgba(255, 107, 107, .35);
      }
      .gs-savenote {
        margin: 9px 2px 0; font-size: 12.5px; line-height: 1.45; color: #bfe9bd;
      }
      .gs-savenote--bad { color: #ffc4b8; }

      /* ── Celebration sparkle burst (assetless, one-shot) ───────────────────────────── */
      .gs-burst { position: absolute; left: 50%; top: 28%; width: 0; height: 0; pointer-events: none; z-index: 4; }
      .gs-spark {
        position: absolute; font-size: 18px; color: var(--gs-gold);
        opacity: 0; transform: translate(-50%, -50%);
        animation: gs-spark-fly .95s ease-out forwards;
      }
      @keyframes gs-spark-fly {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
        18% { opacity: 1; }
        100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); }
      }
      @media (prefers-reduced-motion: reduce) { .gs-spark { animation: none; opacity: 0; } }

      /* ── Hole-in-one celebration overlay (GS-ace) ──────────────────────────────────── */
      .gs-ace {
        position: fixed; inset: 0; z-index: 60; display: flex; align-items: safe center; justify-content: center;
        padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
        /* A fixed takeover that outgrows the screen is unreachable content (GS-a11y-sheet-scroll) —
           the reward list is the whole point of the card, so let the backdrop scroll it. */
        overflow-y: auto; overscroll-behavior: contain;
        background: radial-gradient(120% 90% at 50% 18%, rgba(20,28,46,.86), rgba(8,9,14,.96));
        backdrop-filter: blur(2px); cursor: pointer; animation: gs-ace-fade .35s ease-out both;
      }
      @keyframes gs-ace-fade { from { opacity: 0; } to { opacity: 1; } }
      .gs-ace-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .gs-ace-card {
        position: relative; z-index: 1; text-align: center; max-width: 460px; width: 100%;
        padding: 26px 22px; border-radius: 20px; cursor: default;
        background: linear-gradient(180deg, rgba(18,22,34,.78), rgba(11,13,18,.86));
        border: 1px solid rgba(255,213,74,.4); box-shadow: 0 0 40px rgba(255,213,74,.22), 0 18px 50px rgba(0,0,0,.5);
        animation: gs-ace-pop .5s cubic-bezier(.18,.9,.3,1.3) both;
      }
      @keyframes gs-ace-pop { from { transform: translateY(16px) scale(.82); opacity: 0; } to { transform: none; opacity: 1; } }
      .gs-ace-emoji { font-size: 60px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); animation: gs-ace-bob 1.8s ease-in-out infinite; }
      @keyframes gs-ace-bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(4deg); } }
      .gs-ace-kicker { margin-top: 10px; font-size: 11px; letter-spacing: .22em; color: var(--gs-dim); font-weight: 700; }
      .gs-ace-title {
        margin: 4px 0 2px; font-size: clamp(30px, 9vw, 46px); font-weight: 900; letter-spacing: .01em; line-height: 1;
        background: linear-gradient(180deg, #fff3c4, #ffd54a 55%, #ff9e3c); -webkit-background-clip: text; background-clip: text;
        color: transparent; text-shadow: 0 2px 22px rgba(255,170,60,.4);
      }
      .gs-ace-sub { font-size: 14px; color: var(--gs-ink); opacity: .85; margin-bottom: 14px; }
      .gs-ace-rewards { display: flex; flex-direction: column; gap: 8px; margin: 0 auto 18px; max-width: 360px; }
      .gs-ace-reward {
        display: flex; align-items: center; gap: 11px; text-align: left;
        padding: 9px 13px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--gs-line);
      }
      .gs-ace-reward span { font-size: 20px; flex: 0 0 auto; }
      .gs-ace-reward b { font-size: 14px; color: var(--gs-gold); }
      .gs-ace-reward i { display: block; font-style: normal; font-size: 11px; color: var(--gs-dim); margin-top: 1px; }
      .gs-ace-reward > div, .gs-ace-reward > b { flex: 1 1 auto; min-width: 0; }
      .gs-ace-go { min-width: 180px; }
      @media (prefers-reduced-motion: reduce) {
        .gs-ace, .gs-ace-card { animation: none; }
        .gs-ace-emoji { animation: none; }
      }

      /* ── Eagle / albatross fly-over celebration (GS-bird) ──────────────────────────── */
      .gs-bird {
        position: fixed; inset: 0; z-index: 60; display: flex; align-items: safe flex-end; justify-content: center;
        padding: max(20px, env(safe-area-inset-top)) 18px max(34px, env(safe-area-inset-bottom));
        overflow-y: auto; overscroll-behavior: contain;
        background: radial-gradient(120% 90% at 50% 22%, rgba(14,20,38,.82), rgba(7,8,13,.96));
        backdrop-filter: blur(2px); cursor: pointer; animation: gs-ace-fade .35s ease-out both;
      }
      .gs-bird-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .gs-bird-card {
        position: relative; z-index: 1; text-align: center; max-width: 460px; width: 100%;
        padding: 22px 22px; border-radius: 20px; cursor: default; margin-bottom: calc(var(--gs-dvh) * .04);
        background: linear-gradient(180deg, rgba(18,22,34,.78), rgba(11,13,18,.88));
        animation: gs-ace-pop .5s cubic-bezier(.18,.9,.3,1.3) both;
      }

      .gs-bird-kicker { margin-top: 8px; font-size: 11px; letter-spacing: .22em; color: var(--gs-dim); font-weight: 700; }
      .gs-bird-title {

        -webkit-background-clip: text; background-clip: text; color: transparent;

      /* Eagle = chrome silver. The 🦅 emoji is a brown/gold American eagle on most platforms, which

      .gs-bird--eagle .gs-bird-card { border: 1px solid rgba(200,214,235,.45); box-shadow: 0 0 40px rgba(190,205,230,.2), 0 18px 50px rgba(0,0,0,.5); }
      .gs-bird--eagle .gs-bird-title { background-image: linear-gradient(180deg, #ffffff, #c7d4e8 55%, #93a6c6); text-shadow: 0 2px 22px rgba(170,190,225,.4); }
      .gs-bird--eagle .gs-bird-emoji { filter: grayscale(1) brightness(1.4) contrast(1.02) drop-shadow(0 0 12px rgba(190,205,230,.65)) drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
      /* Albatross = cosmic aurora. Tint the 🕊️ emoji with an aurora glow to match the void copy. */
      .gs-bird--albatross .gs-bird-card { border: 1px solid rgba(122,184,255,.5); box-shadow: 0 0 46px rgba(95,230,200,.22), 0 18px 50px rgba(0,0,0,.5); }
      .gs-bird--albatross .gs-bird-title { background-image: linear-gradient(180deg, #d6c4ff, #7ab8ff 50%, #5fe6c8); text-shadow: 0 2px 26px rgba(120,200,230,.45); }
      .gs-bird--albatross .gs-bird-emoji { filter: brightness(1.1) drop-shadow(0 0 14px rgba(95,230,200,.6)) drop-shadow(0 0 6px rgba(122,184,255,.5)) drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
      @media (prefers-reduced-motion: reduce) {
        .gs-bird, .gs-bird-card { animation: none; }
        .gs-bird-emoji { animation: none; }
      }

      /* ── Voyage-victory takeover (GS-victory) ──────────────────────────────────────── */
      .gs-win {
        position: fixed; inset: 0; z-index: 62; display: flex; align-items: safe center; justify-content: center;
        padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
        overflow-y: auto; overscroll-behavior: contain;
        background: radial-gradient(120% 90% at 50% 16%, rgba(38,30,10,.9), rgba(8,9,14,.97));
        backdrop-filter: blur(2px); cursor: pointer; animation: gs-ace-fade .4s ease-out both;
      }
      .gs-win-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .gs-win-card {
        position: relative; z-index: 1; text-align: center; max-width: 480px; width: 100%;
        padding: 26px 22px; border-radius: 22px; cursor: default;
        background: linear-gradient(180deg, rgba(26,24,16,.82), rgba(11,12,16,.9));
        border: 1px solid rgba(255,213,74,.5); box-shadow: 0 0 52px rgba(255,196,60,.28), 0 18px 54px rgba(0,0,0,.55);
        animation: gs-ace-pop .5s cubic-bezier(.18,.9,.3,1.3) both;
      }
      .gs-win-emoji { font-size: 66px; line-height: 1; filter: drop-shadow(0 0 16px rgba(255,196,60,.6)) drop-shadow(0 4px 10px rgba(0,0,0,.5)); animation: gs-ace-bob 1.8s ease-in-out infinite; }
      .gs-win-kicker { margin-top: 10px; font-size: 11px; letter-spacing: .24em; color: #ffdf9a; opacity: .85; font-weight: 700; }
      .gs-win-title {
        margin: 4px 0 2px; font-size: clamp(34px, 10vw, 54px); font-weight: 900; letter-spacing: .01em; line-height: 1;
        background: linear-gradient(180deg, #fff7d6, #ffd54a 52%, #ff9e3c); -webkit-background-clip: text; background-clip: text;
        color: transparent; text-shadow: 0 2px 26px rgba(255,170,60,.45);
      }
      .gs-win-sub { font-size: 14.5px; color: var(--gs-ink); opacity: .9; margin-bottom: 14px; }
      /* The hero beat: a newly-unlocked Ascension tier, framed as a from → to gate. */
      .gs-win-tier {
        display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
        margin: 0 auto 16px; max-width: 380px; padding: 11px 16px; border-radius: 14px;
        background: linear-gradient(180deg, rgba(255,206,84,.18), rgba(255,158,60,.09));
        border: 1px solid rgba(255,206,84,.5); box-shadow: 0 0 26px rgba(255,196,60,.2) inset;
        font-weight: 800; letter-spacing: .05em; animation: gs-win-tier-glow 2.4s ease-in-out infinite;
      }
      @keyframes gs-win-tier-glow { 0%,100% { box-shadow: 0 0 22px rgba(255,196,60,.16) inset, 0 0 0 rgba(255,196,60,0); } 50% { box-shadow: 0 0 30px rgba(255,196,60,.28) inset, 0 0 22px rgba(255,196,60,.28); } }
      .gs-win-tier-from { font-size: 13px; color: #ffdf9a; opacity: .85; }
      .gs-win-tier-arrow { font-size: 16px; color: #ffce54; }
      .gs-win-tier-to { font-size: 15px; color: #ffce54; text-shadow: 0 0 14px rgba(255,206,84,.5); }
      .gs-win-tier--max { font-size: 13px; color: #ffce54; }
      .gs-win-go { min-width: 200px; margin-top: 4px; }
      @media (prefers-reduced-motion: reduce) {
        .gs-win, .gs-win-card { animation: none; }
        .gs-win-emoji, .gs-win-tier { animation: none; }
      }

      /* ── Character select (GS-18 → GS-select-onescreen): a viewport-locked flex column on phones.
             The header + difficulty pills sit at natural height; the roster grid FILLS the rest, so
             every golfer lands on one mobile screen with no scroll. The grid auto-flows (2 cols on
             phones), so future characters reflow into more rows that SHARE the height — no per-count
             redesign. Cards clip their softest region (the unlocked-clubs strip) first; portrait,
             stats, hint and the Tap-to-play CTA never clip. Desktop keeps the roomy 4-across row. ── */
      .gs-select { display: block; }
      @media (max-width: 999px) {
        .gs-select { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
      }
      /* Header reads like the app's other section heads (accent bar + hairline); the right pad clears
         the fixed settings cog so the title never sits under it. */
      .gs-charhead {
        flex: 0 0 auto;
        border-left: 3px solid var(--gs-gold);
        border-bottom: 1px solid var(--gs-line-2);
        padding: 0 48px 9px 11px;
      }
      .gs-charhead h1 { margin: 0; font-size: 19px; line-height: 1.12; }
      .gs-charhead p { opacity: .78; font-size: 11.5px; margin: .3em 0 0; line-height: 1.4; }
      .gs-select > .gs-diffrow { flex: 0 0 auto; margin: 9px 0 0; }
      /* Keep the two difficulty pills on ONE row on phones (they otherwise stack and steal a whole
         card-row of height); the hint drops to its own line beneath. Pills share the width and their
         value truncates rather than wrapping. */
      @media (max-width: 640px) {
        .gs-select > .gs-diffrow .gs-selpill { flex: 1 1 0; min-width: 0; }
        .gs-select > .gs-diffrow .gs-selpill-sel { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      }
      .gs-charwrap {
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: 1fr; gap: 8px; margin-top: 9px;
      }
      @media (max-width: 999px) {
        /* ONE SCREEN IS A GOAL, NOT A CAGE (GS-a11y-scale-wrap). GS-select-onescreen fits the roster
           to the viewport, and at the ship default it still does. But at a large UI scale the cards
           genuinely need more room than the phone has, and `overflow: hidden` on a viewport-locked
           column turned "doesn't quite fit" into "the bottom row is gone" — with `grid-auto-rows: 1fr`
           squeezing every card until its stats and trait line were clipped mid-word. So: rows keep the
           height their content asks for (`min-content` floor) and the roster SCROLLS when the sum
           exceeds one screen. When it fits — the ship default at every phone size — `1fr` still wins
           and the layout is unchanged. */
        .gs-charwrap {
          flex: 1 1 auto; min-height: 0;
          overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
          scrollbar-width: thin;
          grid-auto-rows: minmax(min-content, 1fr);
        }
        .gs-charwrap::-webkit-scrollbar { width: 5px; }
        .gs-charwrap::-webkit-scrollbar-thumb { background: var(--gs-line); border-radius: 3px; }
      }
      /* A full 4-across roster lineup on desktop — never an orphan 3+1 row. */
      @media (min-width: 1000px) { .gs-charwrap { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; } }
      .gs-charcard {
        position: relative; overflow: hidden; text-align: left; cursor: pointer;
        min-height: 0;
        display: flex; flex-direction: column; gap: 7px;
        padding: 10px 10px 11px; border-radius: var(--gs-r-lg); color: var(--gs-ink);
        border: 1px solid color-mix(in srgb, var(--cc) 45%, var(--gs-line));
        background:
          radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--cc) 22%, transparent), transparent 60%),
          linear-gradient(180deg, #141823, var(--gs-bg-2));
        box-shadow: var(--gs-shadow);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        opacity: 0; transform: translateY(14px);
        animation: gs-char-in .42s cubic-bezier(.2,.7,.3,1) both;
        transition: transform .16s ease, box-shadow .2s ease, border-color .2s ease;
      }
      @keyframes gs-char-in { to { opacity: 1; transform: none; } }
      /* Hover effects are gated to pointers that actually hover — on touch devices :hover
         LATCHES after a tap, which left the last-tapped card (e.g. Bo) stuck with the solid
         CTA fill while the others showed the gentle resting tint. */
      @media (hover: hover) {
        .gs-charcard:hover {
          transform: translateY(-4px);
          border-color: var(--cc);
          box-shadow: 0 10px 30px -8px color-mix(in srgb, var(--cc) 60%, transparent), 0 0 0 1px color-mix(in srgb, var(--cc) 50%, transparent) inset;
        }
      }
      .gs-charcard:active { transform: translateY(-1px); }
      .gs-charcard:focus-visible { outline: 2px solid var(--cc); outline-offset: 2px; }
      /* A diagonal light sheen that sweeps across on hover. */
      .gs-charcard-sheen {
        position: absolute; inset: 0; pointer-events: none; z-index: 1;
        background: linear-gradient(115deg, transparent 30%, color-mix(in srgb, var(--cc) 30%, #fff) 50%, transparent 70%);
        opacity: 0; transform: translateX(-120%); mix-blend-mode: screen;
      }
      @media (hover: hover) { .gs-charcard:hover .gs-charcard-sheen { animation: gs-char-sheen .7s ease; } }
      @keyframes gs-char-sheen { 0% { opacity: 0; transform: translateX(-120%); } 35% { opacity: .8; } 100% { opacity: 0; transform: translateX(120%); } }
      .gs-charcard > * { position: relative; z-index: 2; }
      /* The portrait + name sit side by side while the name has room for it. At a large UI scale the
         id column was squeezed to ~33px and the name broke one letter per line ("Fea/the/r/Fad/e"), so
         give the column a flex BASIS it must be granted and let the row wrap when it can't be: the
         portrait then takes its own line and the name gets the full card width. A breakpoint cannot
         make this call — it cannot see `--gs-uiscale` (GS-a11y-scale-wrap). */
      .gs-charcard-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
      /* GS-char-lore: the portrait square is its OWN tap target — tapping it opens the golfer's lore
         popup (the surrounding card still selects). A hover lift + an "ⓘ Lore" badge advertise it. */
      .gs-charcard-port {
        position: relative; flex: 0 0 auto; display: grid; place-items: center; width: 56px; height: 66px;
        border-radius: 10px; background: radial-gradient(60% 60% at 50% 40%, #1b2230, #0d1018);
        border: 1px solid color-mix(in srgb, var(--cc) 30%, var(--gs-line)); cursor: pointer; padding: 0;
        transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
      }
      .gs-charcard-port:hover, .gs-charcard-port:focus-visible {
        outline: none; transform: translateY(-2px);
        border-color: color-mix(in srgb, var(--cc) 70%, transparent);
        box-shadow: 0 4px 12px -4px color-mix(in srgb, var(--cc) 60%, transparent);
      }
      /* GS-a11y-focus: the portrait sits INSIDE the card button, so its focus ring is the only cue
         that Tab has moved from "pick this golfer" to "read their story" — a 2px lift isn't enough. */
      .gs-charcard-port:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }
      .gs-charcard-lore {
        position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
        font-size: 8.5px; font-weight: 800; letter-spacing: .03em; white-space: nowrap;
        padding: 1px 6px; border-radius: 999px; color: var(--cc);
        background: color-mix(in srgb, #0d1018 82%, var(--cc)); border: 1px solid color-mix(in srgb, var(--cc) 55%, transparent);
        opacity: .82; pointer-events: none;
      }
      .gs-charcard-port:hover .gs-charcard-lore, .gs-charcard-port:focus-visible .gs-charcard-lore { opacity: 1; }
      .gs-charcard-id { flex: 1 1 78px; min-width: 0; }
      /* `overflow-wrap: anywhere` NOT `break-word`: at 1.45x "Longshot" is wider than half a 390px
         phone on its own, and only `anywhere` will break inside a word that has no break opportunity.
         Inert at the ship scale, where every name already fits. */
      .gs-charcard-name {
        display: block; font-size: 15px; line-height: 1.15; overflow-wrap: anywhere; hyphens: auto;
        text-shadow: 0 0 14px color-mix(in srgb, var(--cc) 55%, transparent);
      }
      /* Two lines beat one ellipsis: at a large scale the nowrap version clipped every origin to
         three letters ("Nai…"), which tells the player nothing. */
      .gs-charcard-org {
        font-size: 10.5px; opacity: .65; margin-top: 3px; overflow-wrap: anywhere;
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
      }
      /* GS-save-slots: the "you already have a run going" row. `flex-wrap` + `min-width:0` rather than
         a breakpoint — at 1.45x the badge and the ghost restart can't share a line on a 375px phone,
