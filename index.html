<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Always revalidate index.html so a new deploy never serves a stale page that
         points at a content-hashed asset that no longer exists (the assets themselves
         are safe to cache forever). Best-effort on GitHub Pages, where we don't control
         HTTP headers. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Golf Stars</title>
    <!-- PWA: installable as an app. The manifest + icons are external files copied verbatim
         into dist/ (NOT inlined by vite-plugin-singlefile) — an install manifest can't be a
         data-URI. Hrefs are relative so they resolve under the Pages subpath (/golf-stars/). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Golf Stars" />
    <style>
      /* ───────────────────────────────────────────────────────────────────────
         Golf Stars — design tokens + component classes (UI polish pass).
         The DOM shell (app.ts / cards.ts) is styled freely here; the SVG render
         layer is deterministic and untouched. Tokens live as CSS variables so the
         whole theme shifts from one place; component classes carry the hover/
         active/focus states that pure inline styles can't express.
         ─────────────────────────────────────────────────────────────────────── */
      :root {
        --gs-bg: #0b0d12;          /* app background (matches the intro sky handoff) */
        --gs-bg-2: #11141b;        /* card / panel fill */
        --gs-panel: #161b25;       /* slightly raised surface */
        --gs-ink: #e8e8ea;         /* primary text */
        --gs-dim: #9aa1ad;         /* muted text */
        --gs-line: #2a3142;        /* default border */
        --gs-line-2: #1c2029;      /* hairline / divider */
        --gs-accent: #5fd45a;      /* primary green (calls to action) */
        --gs-info: #9fd8e6;        /* info cyan */
        --gs-danger: #ff6b6b;      /* miss / penalty */
        --gs-gold: #e08a2b;        /* outpost / shards */
        --gs-warn: #ffc454;        /* spray edge / caution */
        --gs-r: 10px;              /* control radius */
        --gs-r-lg: 14px;           /* card radius */
        --gs-shadow: 0 2px 10px rgba(0, 0, 0, .45);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--gs-bg);
        color: var(--gs-ink);
        /* A faint cosmic vignette so flat panels sit on a living sky, not a slab. */
        background-image:
          radial-gradient(1100px 620px at 78% -8%, #18203044 0%, transparent 60%),
          radial-gradient(900px 520px at 12% 4%, #1a162a3a 0%, transparent 58%);
        background-attachment: fixed;
      }
      .gs-main {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 820px; margin: 0 auto;
        /* Respect the notch / home-indicator on installed PWAs (viewport-fit=cover). The
           top/bottom insets are mirrored in .gs-shot's height math below so the fixed play
           screen still fits exactly without scrolling. */
        padding:
          calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
        color: var(--gs-ink); min-height: 100vh;
      }
      .gs-main h1, .gs-main h2, .gs-main h3 { letter-spacing: .2px; }
      ::selection { background: #5fd45a44; }

      /* ── Buttons ─────────────────────────────────────────────────────────── */
      .gs-btn {
        font: 600 14px/1.15 system-ui, sans-serif;
        padding: 9px 14px;
        border-radius: var(--gs-r);
        border: 1px solid var(--btn-border, var(--gs-line));
        background: linear-gradient(180deg, #232838, #191d27);
        color: var(--gs-ink);
        cursor: pointer;
        margin: 3px 4px 3px 0;
        -webkit-tap-highlight-color: transparent;
        /* manipulation kills the 300ms tap delay + double-tap-zoom on controls; no text
           selection so a fast tap or a map drag never selects a label. */
        touch-action: manipulation;
        user-select: none; -webkit-user-select: none;
        transition: transform .07s ease, box-shadow .16s ease,
                    border-color .16s ease, filter .16s ease, background .16s ease;
      }
      .gs-btn:hover {
        border-color: var(--btn-hover, #46506a);
        filter: brightness(1.13);
        box-shadow: 0 3px 14px rgba(0, 0, 0, .42);
      }
      .gs-btn:active { transform: translateY(1px); filter: brightness(.97); }
      .gs-btn:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }
      .gs-btn[disabled] {
        opacity: .5; cursor: default; filter: none; transform: none; box-shadow: none;
        background: #15171d; color: #6a7080; border-color: #22262f;
      }
      .gs-btn--block { display: block; width: 100%; text-align: left; }
      .gs-btn--primary {
        --btn-border: #2f8c3a;
        background: linear-gradient(180deg, #1f5e2d, #163a20);
        color: #ecffe9;
      }
      .gs-btn--primary:hover { --btn-hover: var(--gs-accent); box-shadow: 0 0 16px rgba(95, 212, 90, .32); }
      .gs-btn--ghost { background: linear-gradient(180deg, #1a1e27, #14171f); color: var(--gs-dim); }
      .gs-btn--ghost:hover { color: var(--gs-ink); }
      .gs-btn--on {
        --btn-border: var(--gs-accent);
        background: linear-gradient(180deg, #1d4a2a, #163a20);
        color: #ecffe9;
        box-shadow: 0 0 12px rgba(95, 212, 90, .22);
      }

      /* ── Panels, banners, chips ──────────────────────────────────────────── */
      .gs-panel {
        border: 1px solid var(--gs-line);
        border-radius: var(--gs-r-lg);
        background: linear-gradient(180deg, #141823, var(--gs-bg-2));
        padding: 12px 14px; margin: 8px 0;
        box-shadow: var(--gs-shadow);
      }
      /* ── Ship fuel (GS-fuel-2): the segmented tank gauge + the Fuel Depot panel. The gauge is a
             row of glowing fuel CELLS (--fuel-col set inline: cyan → amber → red as it drains) so
             the tank reads at a glance on a phone; the mini variant rides the run header. The
             depot is a proper spaceport counter — panel-framed, price up front — not a text box. ── */
      .gs-fuelbar { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
      .gs-fuelbar__ico { line-height: 1; }
      .gs-fuelbar__cells {
        display: inline-flex; gap: 2px; padding: 2.5px 3px;
        border: 1px solid var(--gs-line); border-radius: 5px; background: #0a0e16;
      }
      .gs-fuelbar__cell { width: 7px; height: 12px; border-radius: 2px; background: #1d2331; }
      .gs-fuelbar__cell--lit { background: var(--fuel-col); box-shadow: 0 0 5px var(--fuel-col); }
      .gs-fuelbar__n { font-size: 13px; }
      .gs-fuelbar__over {
        font-size: 10px; font-weight: 800; color: #4fd0e0; border: 1px solid #4fd0e055;
        border-radius: 999px; padding: 0 5px;
      }
      .gs-fuelbar--mini { gap: 4px; }
      .gs-fuelbar--mini .gs-fuelbar__cells { padding: 2px; gap: 1.5px; }
      .gs-fuelbar--mini .gs-fuelbar__cell { width: 4.5px; height: 9px; border-radius: 1.5px; }
      .gs-fuelbar--mini .gs-fuelbar__n { font-size: 12px; }
      /* Vertical variant (GS-journey-map-redesign / GS-journey-hud): a fuel COLUMN — the COUNT on top,
         cells stacked and filling from the BOTTOM up (column-reverse, since the lit cells lead the DOM),
         the ⛽ icon anchored at the FOOT. Rides the right pillar of the bridge HUD. */
      .gs-fuelbar--vert { flex-direction: column; gap: 3px; }
      .gs-fuelbar--vert .gs-fuelbar__cells { flex-direction: column-reverse; padding: 3px; gap: 2.5px; }
      .gs-fuelbar--vert .gs-fuelbar__cell { width: 14px; height: 7px; border-radius: 2px; }
      .gs-fuelbar--vert .gs-fuelbar__n { font-size: 13px; font-variant-numeric: tabular-nums; }
      .gs-fuelbar--vert .gs-fuelbar__ico { font-size: 15px; }
      .gs-fuelbar--vert .gs-fuelbar__over { order: -1; }
      .gs-fueldepot {
        display: flex; flex-direction: column; gap: 8px;
        border: 1px solid #4fd0e044; border-left: 4px solid #4fd0e0aa;
        border-radius: var(--gs-r-lg); padding: 10px 12px; margin: 12px 0 0;
        background: linear-gradient(180deg, #12202a, #0e141d);
      }
      .gs-fueldepot__head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .gs-fueldepot__title { font-size: 14px; font-weight: 800; color: #4fd0e0; letter-spacing: .03em; }
      .gs-fueldepot__price { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--gs-dim); white-space: nowrap; }
      .gs-fueldepot__row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .gs-fueldepot__row .gs-btn { flex: 1 1 auto; font-size: 13px; padding: 9px 10px; text-align: center; }
      .gs-fueldepot__note { font-size: 11.5px; opacity: .6; margin: 0; }
      /* ── Stop intro (GS-intro-split): two mobile-first steps — the ARC (mode + field of
             competitors) then the HOLE (map + hazards popup). Each step is built to hold one
             phone screen; the arc's bottom First-Tee is revealed by JS only when the field
             overflows, and the hole map is viewport-capped so its action row stays on-screen. ── */
      .gs-intro-ctarow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
      .gs-intro-ctarow--bottom { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--gs-line-2); }
      .gs-intro-first { flex: 1 1 auto; min-width: 160px; text-align: center; font-size: 16px; padding: 14px 18px; }
      .gs-holeintro { display: flex; flex-direction: column; gap: 10px; }
      .gs-holeintro-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
      .gs-holeintro-boss {
        font-size: 12px; font-weight: 700; letter-spacing: .04em; border: 1px solid; border-radius: 8px;
        padding: 5px 10px; background: linear-gradient(180deg, #1a0e12, #120b10);
      }
      .gs-holeintro-map {
        border-radius: 12px; overflow: hidden; border: 1px solid var(--gs-line-2);
        line-height: 0; background: #0d1016;
      }
      .gs-holeintro-map svg { display: block; width: 100%; height: auto; max-height: 44vh; margin: 0 auto; }
      .gs-holeintro-ctas { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .gs-holeintro-ctas .gs-btn { flex: 1 1 auto; text-align: center; }
      .gs-holeintro-ctas .gs-btn--primary { flex: 2 1 40%; font-size: 16px; padding: 13px 16px; }
      .gs-holeintro-back { flex: 0 0 auto; }
      .gs-traits-bar {
        display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px;
        border: 1px solid var(--gs-line-2); border-radius: 10px; background: #ffffff06;
        color: var(--gs-ink); cursor: pointer; font: inherit; text-align: left;
      }
      .gs-traits-bar:hover { border-color: var(--gs-line); background: #ffffff0d; }
      .gs-traits-bar:active { transform: translateY(1px); filter: brightness(.97); }
      .gs-trait-chip { display: inline-flex; align-items: center; gap: 6px; }
      .gs-trait-chip-i { font-size: 15px; }
      .gs-trait-chip-l { font-size: 11.5px; font-weight: 700; color: var(--tc); letter-spacing: .02em; }
      .gs-traits-bar-more { margin-left: auto; font-size: 11.5px; opacity: .6; white-space: nowrap; }
      /* ── Title screen (GS-title-2): hero wordmark, section labels, and the game-mode tiles.
             The mode tiles speak the SAME painted-scene + caption language as the Market/Clubhouse
             doorways (one visual family) but are unmistakably the games: taller, accent-bordered
             (--mc = mode accent), badged, and carrying a launch bar. The whole tile is the button. ── */
      .gs-hero { text-align: center; padding: 4px 0 2px; }
      .gs-hero-title {
        margin: 0; font-size: 34px; letter-spacing: .045em; line-height: 1.1;
        color: #ecffe9;
        text-shadow: 0 0 22px rgba(95, 212, 90, .38), 0 0 44px rgba(255, 206, 84, .18);
      }
      .gs-hero-tag {
        margin: .45em 0 0; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
        color: var(--gs-dim); text-wrap: balance;
      }
      .gs-hero-chips { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      .gs-seclabel {
        font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase;
        color: var(--gs-dim); margin: 20px 0 8px;
        display: flex; align-items: center; gap: 10px;
      }
      .gs-seclabel::after { content: ''; flex: 1; height: 1px; background: var(--gs-line-2); }
      /* ── Character-select difficulty picker (GS-title-2): Ascension chips, chosen with the golfer ── */
      .gs-ascpick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
      .gs-ascpick-l { flex: 0 0 auto; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--gs-gold); }
      /* Chips ride a single fixed-height strip that scrolls sideways rather than wrapping to a new
         row — so more unlocked tiers never reflow the roster below or resize the screen (GS-title-2). */
      .gs-ascpick-chips {
        flex: 1 1 auto; min-width: 0; display: flex; gap: 5px;
        overflow-x: auto; overflow-y: hidden; padding-bottom: 2px;
        scrollbar-width: thin; -webkit-overflow-scrolling: touch;
      }
      .gs-ascpick-chip { flex: 0 0 auto; padding: 6px 11px; font-size: 12.5px; margin: 0; }
      .gs-ascpick-hint { flex-basis: 100%; font-size: 10.5px; opacity: .55; }
      /* ── Character-select difficulty PILLS (GS-diffpills): compact native-select dropdowns that fit one
         mobile row and never reflow the roster below (the OS supplies the picker on tap). ── */
      .gs-diffrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 2px; }
      .gs-selpill {
        position: relative; display: inline-flex; align-items: center; gap: 5px;
        padding: 5px 8px 5px 11px; border-radius: 999px;
        border: 1px solid var(--cc, var(--gs-line)); background: var(--gs-bg-2); box-shadow: var(--gs-shadow);
      }
      .gs-selpill-l { font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--cc, var(--gs-gold)); white-space: nowrap; }
      .gs-selpill-sel {
        appearance: none; -webkit-appearance: none; background: transparent; border: 0; outline: none;
        color: var(--gs-ink); font: 800 13px/1 system-ui, sans-serif; padding: 3px 17px 3px 2px; cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .gs-selpill-sel option { color: #111; background: #fff; }
      .gs-selpill-caret { position: absolute; right: 10px; pointer-events: none; opacity: .65; font-size: 10px; color: var(--cc, var(--gs-ink)); }
      .gs-diffrow-hint { flex-basis: 100%; font-size: 10.5px; opacity: .55; }
      /* The per-golfer club-unlock badge on the select card (GS-ascension-clubs display): does a win at the
         selected Ascension grow THIS golfer's bag? green = yes, dim = already cleared, gold = bag full. */
      .gs-unlock-badge { font-size: 10px; font-weight: 800; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
      .gs-unlock-badge--go { color: #07120a; background: var(--gs-accent); }
      .gs-unlock-badge--wait { color: var(--gs-dim); background: #ffffff10; border: 1px solid var(--gs-line-2); }
      .gs-unlock-badge--full { color: #1a1400; background: var(--gs-gold); }
      .gs-chip {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 13px; padding: 4px 10px; border-radius: 999px;
        border: 1px solid var(--gs-line); background: #ffffff08;
      }
      .gs-clickcard { transition: transform .12s ease, filter .16s ease; }
      .gs-clickcard:hover { transform: translateY(-3px); filter: brightness(1.08); }
      .gs-clickcard:active { transform: translateY(-1px); }

      /* ── Collapsible section (Trade Market accordion) ────────────────────── */
      .gs-acc {
        border: 1px solid var(--gs-line); border-radius: var(--gs-r-lg);
        background: var(--gs-bg-2); margin: 10px 0; overflow: hidden;
      }
      .gs-acc__head {
        width: 100%; display: flex; align-items: center; gap: 9px;
        padding: 11px 14px; border: 0; cursor: pointer;
        background: linear-gradient(180deg, #161b25, #12151d);
        color: var(--gs-ink); font: inherit; text-align: left;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: background .16s ease;
      }
      .gs-acc__head:hover { background: linear-gradient(180deg, #1b2130, #141823); }
      .gs-acc__head:focus-visible { outline: 2px solid var(--gs-info); outline-offset: -2px; }
      .gs-acc__icon { font-size: 17px; line-height: 1; }
      .gs-acc__title { font-size: 15px; font-weight: 700; }
      .gs-acc__count {
        font-size: 11.5px; color: var(--gs-dim); font-variant-numeric: tabular-nums;
        border: 1px solid var(--gs-line); border-radius: 999px; padding: 1px 8px;
      }
      .gs-acc__chev {
        margin-left: auto; font-size: 13px; color: var(--gs-dim);
        transition: transform .2s ease;
      }
      .gs-acc--collapsed .gs-acc__chev { transform: rotate(-90deg); }
      .gs-acc__body { padding: 8px 10px 12px; }
      .gs-acc--collapsed .gs-acc__body { display: none; }
      .gs-acc__blurb { font-size: 12px; opacity: .6; margin: .2em 0 .6em; text-align: center; }
      .gs-acc__rack { display: flex; flex-wrap: wrap; justify-content: center; }

      /* ── Settings cog (fixed, top-right) ─────────────────────────────────── */
      .gs-cog {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: calc(12px + env(safe-area-inset-right));
        z-index: 60;
        width: 42px; height: 42px;
        display: flex; align-items: center; justify-content: center;
        font-size: 22px; line-height: 1;
        border-radius: 50%;
        border: 1px solid var(--gs-line);
        background: radial-gradient(circle at 40% 35%, #232838, #14171f);
        color: var(--gs-dim); cursor: pointer; box-shadow: var(--gs-shadow);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: transform .25s ease, color .16s ease, border-color .16s ease, filter .16s ease;
      }
      .gs-cog:hover { color: var(--gs-ink); border-color: #46506a; filter: brightness(1.1); transform: rotate(50deg); }
      .gs-cog:active { filter: brightness(.95); }
      .gs-cog:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }

      /* ── Nav doorways: the Trade Market / Clubhouse tiles on the title ────── */
      .gs-navtiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0 16px; }
      @media (max-width: 460px) { .gs-navtiles { grid-template-columns: 1fr; } }
      /* Phones: tighten the title's vertical rhythm so all four stacked doorways + hero fit one
         screen without a scroll (the tiles stack 1-up here, so 150px each overruns short phones). */
      @media (max-width: 460px) {
        .gs-seclabel { margin: 13px 0 6px; }
        .gs-navtiles { margin: 8px 0 12px; }
        .gs-hero-chips { margin-top: 8px; }
      }
      .gs-navtile {
        position: relative; display: block; width: 100%; min-height: 134px; padding: 0;
        border-radius: var(--gs-r-lg); border: 1px solid var(--gs-line);
        background: var(--gs-bg-2); color: var(--gs-ink); cursor: pointer; overflow: hidden;
        text-align: left; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        box-shadow: var(--gs-shadow);
        transition: transform .14s ease, box-shadow .18s ease, border-color .16s ease, filter .16s ease;
      }
      .gs-navtile:hover { transform: translateY(-3px); border-color: #46506a; filter: brightness(1.05); box-shadow: 0 8px 22px rgba(0, 0, 0, .5); }
      .gs-navtile:active { transform: translateY(-1px); }
      .gs-navtile:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }
      .gs-navtile__art { position: absolute; inset: 0; display: block; }
      .gs-navtile__art svg { display: block; width: 100%; height: 100%; }
      .gs-navtile__cap {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: flex; flex-direction: column; gap: 2px; padding: 28px 14px 12px;
        background: linear-gradient(180deg, transparent, rgba(8, 9, 14, .88) 62%);
      }
      .gs-navtile__title { font: 700 18px/1.1 system-ui, sans-serif; }
      .gs-navtile__sub { font-size: 12px; opacity: .82; }
      /* ACCENT tiles (GS-title-2): the Voyage / Unending game doorways AND the Trade Market /
         Clubhouse between-run doorways share one component, distinguished only by the `--mc`
         accent on border + title (gold / violet / trade-teal / green). Game tiles set --mc inline. */
      .gs-navtile--market { --mc: #39d9c4; }
      .gs-navtile--clubhouse { --mc: #7ed957; }
      .gs-navtile--game, .gs-navtile--market, .gs-navtile--clubhouse {
        min-height: 150px; border-color: color-mix(in srgb, var(--mc) 45%, var(--gs-line));
      }
      .gs-navtile--game:hover, .gs-navtile--market:hover, .gs-navtile--clubhouse:hover { border-color: var(--mc); }
      .gs-navtile--game .gs-navtile__title,
      .gs-navtile--market .gs-navtile__title,
      .gs-navtile--clubhouse .gs-navtile__title { color: var(--mc); text-shadow: 0 0 14px color-mix(in srgb, var(--mc) 40%, transparent); }
      /* Phones: the four accent doorways stack 1-up, so 150px each overruns short screens — trim
         their height (and the caption's top padding to match) so the whole title fits, no scroll.
         Placed AFTER the 150px rule above so it wins on equal specificity. */
      @media (max-width: 460px) {
        .gs-navtile--game, .gs-navtile--market, .gs-navtile--clubhouse { min-height: 122px; }
        .gs-navtile__cap { padding-top: 22px; padding-bottom: 10px; }
      }

      /* ── Clubhouse: tap-to-restyle character stage + garage bay + slot picker ─ */
      .gs-cstage {
        position: relative; margin: 8px auto 6px; max-width: 340px; min-height: 250px;
        border: 1px solid var(--gs-line); border-radius: var(--gs-r-lg); overflow: hidden;
        background:
          radial-gradient(115% 74% at 50% 4%, #26304e 0%, transparent 58%),
          radial-gradient(52% 30% at 50% 100%, rgba(255, 255, 255, .07), transparent 72%),
          linear-gradient(180deg, #12141d, #0b0d12);
      }
      .gs-cstage__figure { position: relative; z-index: 1; display: flex; justify-content: center; padding: 12px 0 8px; }
      .gs-cstage__figure svg { height: 232px; width: auto; filter: drop-shadow(0 7px 11px rgba(0, 0, 0, .55)); }
      /* Invisible tap band over one body part; a floating chip names the worn piece. */
      .gs-czone {
        position: absolute; left: 0; right: 0; z-index: 3; display: flex; align-items: center;
        padding: 0 10px; border: 0; background: transparent; cursor: pointer;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      }
      .gs-czone::before {
        content: ''; position: absolute; inset: 6px 28% 6px 28%;
        border: 1.6px dashed transparent; border-radius: 44px;
        transition: border-color .16s ease, background .16s ease;
      }
      .gs-czone:hover::before { border-color: #ffffff55; background: #ffffff0f; }
      .gs-czone:focus-visible { outline: none; }
      .gs-czone:focus-visible::before { border-color: var(--gs-info); }
      .gs-czone--active::before { border-color: var(--gs-warn); background: #ffc45416; }
      /* Chips zig-zag down the figure — hat-R, shirt-L, pants-R, bag-L, driver-R — so none crosses the
         face/torso centre and each slot's tap-band wraps ONLY its own body part (no band spilling over a
         neighbour's item glyph). */
      .gs-czone--hat   { top: 0%;  height: 24%; justify-content: flex-end; }
      .gs-czone--shirt { top: 24%; height: 26%; justify-content: flex-start; }
      /* Pants labels the LEGS only (not the feet): its chip rides the RIGHT edge at mid-leg height so it
         clears the body centre AND leaves the feet corners free for the bag/driver chips + item glyphs
         (its active highlight no longer envelops them). */
      .gs-czone--pants { top: 50%; height: 20%; justify-content: flex-end; align-items: center; }
      .gs-czone--pants::before { inset: 6px 6px 6px 8%; border-radius: 22px; }
      .gs-czone--pants .gs-czone__chip { max-width: 96%; }
      /* The golf-bag prop stands at the figure's left; its tap band owns the lower-LEFT corner and its
         chip sits at the bottom, beside the propped bag (GS-unending). Widened to ~46% so the longer
         earned-bag names no longer truncate to "Evergreen Tou…". */
      .gs-czone--bag   { top: 70%; height: 29%; right: 54%; justify-content: flex-start; align-items: flex-end; padding-bottom: 6px; z-index: 4; }
      .gs-czone--bag::before { inset: 6px 8% 6px 6px; border-radius: 22px; }
      .gs-czone--bag .gs-czone__chip { max-width: 96%; }
      /* The driver (the swung club) mirrors the bag on the figure's RIGHT — lower-right corner, chip at
         the bottom beside the propped club (GS-thor). Same widened band so "Thor's Hammer" reads whole. */
      .gs-czone--driver { top: 70%; height: 29%; left: 54%; justify-content: flex-end; align-items: flex-end; padding-bottom: 6px; z-index: 4; }
      .gs-czone--driver::before { inset: 6px 6px 6px 8%; border-radius: 22px; }
      .gs-czone--driver .gs-czone__chip { max-width: 96%; }
      .gs-czone__chip {
        position: relative; z-index: 4; display: inline-flex; align-items: center; gap: 5px;
        max-width: 47%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font: 700 11.5px/1 system-ui, sans-serif; color: var(--gs-ink);
        padding: 5px 9px; border-radius: 999px;
        background: rgba(10, 12, 18, .84); border: 1px solid var(--gs-line); box-shadow: var(--gs-shadow);
      }
      .gs-czone--active .gs-czone__chip { border-color: var(--gs-warn); color: var(--gs-warn); }
      .gs-czone__pen { opacity: .55; font-weight: 400; }
      .gs-clubset {
        text-align: center; margin: 2px 0 8px; font: 700 12px/1 system-ui, sans-serif; color: #ff4fd8;
      }
      .gs-clubhint { text-align: center; font-size: 12.5px; opacity: .6; margin: 8px 0 4px; }

      /* The garage bay tile — a wide tap target that opens the ride picker. */
      .gs-garage {
        position: relative; display: block; width: 100%; margin: 4px 0 2px; min-height: 130px;
        padding: 0; overflow: hidden; border-radius: var(--gs-r-lg); border: 1px solid #35507a;
        background: var(--gs-bg-2); color: var(--gs-ink); cursor: pointer; box-shadow: var(--gs-shadow);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: transform .14s ease, box-shadow .18s ease, border-color .16s ease, filter .16s ease;
      }
      .gs-garage:hover { transform: translateY(-2px); border-color: #5a7db0; filter: brightness(1.06); box-shadow: 0 8px 22px rgba(0, 0, 0, .5); }
      .gs-garage:active { transform: translateY(0); }
      .gs-garage:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }
      .gs-garage--active { border-color: var(--gs-warn); box-shadow: 0 0 0 1px var(--gs-warn), var(--gs-shadow); }
      .gs-garage__art { position: absolute; inset: 0; display: block; }
      .gs-garage__art svg { display: block; width: 100%; height: 100%; }
      .gs-garage__cap {
        position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end;
        justify-content: space-between; gap: 8px; padding: 26px 12px 11px;
        background: linear-gradient(180deg, transparent, rgba(8, 9, 14, .9) 66%);
      }
      .gs-garage__name { display: block; font: 700 15px/1.15 system-ui, sans-serif; }
      .gs-garage__sub { display: block; font-size: 11.5px; opacity: .78; text-transform: capitalize; }
      .gs-garage__edit {
        flex: none; align-self: flex-end; font: 700 11px/1 system-ui, sans-serif; color: var(--gs-warn);
        padding: 5px 9px; border: 1px solid var(--gs-warn); border-radius: 999px; background: rgba(10, 12, 18, .72);
        white-space: nowrap;
      }

      /* The revealed slot picker (owned rack for the tapped slot). */
      .gs-cpick {
        border: 1px solid var(--gs-warn); border-radius: var(--gs-r-lg);
        background: linear-gradient(180deg, #171a24, var(--gs-bg-2)); margin: 10px 0 4px; padding: 10px 10px 12px;
        animation: gsPickIn .18s ease;
      }
      @keyframes gsPickIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
      .gs-cpick__head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .gs-cpick__title { font: 700 15px/1 system-ui, sans-serif; }
      .gs-cpick__done {
        margin-left: auto; font: 700 12px/1 system-ui, sans-serif; color: var(--gs-dim);
        background: transparent; border: 1px solid var(--gs-line); border-radius: 999px; padding: 5px 11px; cursor: pointer;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: color .16s ease, border-color .16s ease;
      }
      .gs-cpick__done:hover { color: var(--gs-ink); border-color: #46506a; }
      .gs-cpick__rack { display: flex; flex-wrap: wrap; justify-content: center; }
      .gs-cpick__empty { text-align: center; font-size: 12.5px; opacity: .75; padding: 4px 0 8px; }

      /* ── Scorecard table ─────────────────────────────────────────────────── */
      .gs-scorecard { border-collapse: collapse; font-size: 13px; width: 100%; }
      .gs-scorecard th { padding: 2px 8px; opacity: .55; text-align: left; font-weight: 600; }
      .gs-scorecard td { padding: 3px 8px; }
      .gs-scorecard tr[data-action] { cursor: pointer; transition: background .12s ease; }
      .gs-scorecard tr[data-action]:hover { background: #1d212c; }

      /* Interactive play layout (GS-mechanics #3): map + controls side-by-side on wide screens;
         on mobile, a big map with the Hit action bar pinned to the bottom of the viewport so it
         never needs scrolling to reach. */
      .gs-play { display: flex; gap: 18px; align-items: flex-start; }
      .gs-map { flex: 0 1 460px; max-width: 60%; }
      .gs-map svg { display: block; width: 100%; height: auto; touch-action: none; }
      .gs-controls { flex: 1 1 250px; min-width: 230px; }
      @media (max-width: 640px) {
        .gs-play { flex-direction: column; gap: 10px; }
        .gs-map { width: 100%; max-width: 100%; flex: none; display: flex; justify-content: center; }
        .gs-map svg { width: auto; height: auto; max-height: 56vh; max-width: 100%; }
        .gs-controls { width: 100%; }
        .gs-hitbar {
          position: sticky; bottom: 0; z-index: 20; display: flex; gap: 8px;
          background: linear-gradient(180deg, transparent, var(--gs-bg) 28%);
          padding: 10px 0 8px; box-shadow: 0 -10px 16px var(--gs-bg);
        }
        .gs-hitbar .gs-btn { flex: 1; margin: 0; padding: 13px 10px; font-size: 16px; text-align: center; }
      }

      /* Uplifted shot screen (the map IS the screen): a full-height flex column — compact stat
         bar on top, the map filling ALL the leftover space, club/strategy/hit at the bottom.
         Sizing the map as the flex remainder (not a fixed vh) means the controls always fit
         under it without a scroll or an overlapping sticky footer. */
      .gs-shot {
        display: flex; flex-direction: column; gap: 8px;
        /* Fixed to the viewport (not min-height) + overflow-hidden so the play screen NEVER
           scrolls — the map absorbs the slack and the club/aim/Hit controls always sit on
           screen without scrolling down to reach them. The 46px is .gs-main's vertical
           padding (18+28); the safe-area insets are subtracted too since .gs-main now adds
           them to its padding, so the math stays exact on notched phones. */
        height: calc(100vh - 46px);
        height: calc(100dvh - 46px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        overflow: hidden;
      }
      .gs-topbar {
        flex: 0 0 auto;
        display: flex; flex-direction: column; gap: 3px;
        padding: 7px 12px; border: 1px solid var(--gs-line); border-radius: var(--gs-r);
        background: linear-gradient(180deg, #141823, var(--gs-bg-2));
      }
      .gs-topbar .gs-stats {
        display: flex; align-items: center; gap: 13px; flex-wrap: wrap;
        font-size: 14px; color: var(--gs-dim);
      }
      .gs-topbar .gs-stats b { color: var(--gs-ink); }
      .gs-topbar .gs-sub { font-size: 12px; opacity: .82; line-height: 1.5; }
      /* The lie is the player's most decision-relevant fact — a bordered, colour-coded chip
         (green ok / amber caution / red trouble) right in the sub-line, with its carry+spray hit. */
      .gs-liechip {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 12px; padding: 1px 8px; border-radius: 999px;
        border: 1px solid currentColor; white-space: nowrap;
      }
      /* Momentum rail — one pip per hole, coloured by score; current ringed, upcoming dim. */
      .gs-pips { display: flex; gap: 4px; align-items: center; margin-top: 1px; }
      .gs-pip {
        width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto;
        background: #2a3142; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
      }
      .gs-pip--cur { box-shadow: 0 0 0 2px var(--gs-info); background: #3a4356; }
      .gs-shotscore {
        margin-left: auto; font-weight: 700; font-size: 13px;
        padding: 2px 11px; border-radius: 999px; border: 1px solid currentColor;
      }
      .gs-bigmap {
        /* min-height:0 lets the map shrink to whatever the topbar + controls leave, so the
           controls never get pushed below the fold. position:relative anchors the nav overlay. */
        flex: 1 1 0; min-height: 0; position: relative;
        display: flex; justify-content: center; align-items: center;
        border: 1px solid var(--gs-line); border-radius: var(--gs-r);
        overflow: hidden; box-shadow: var(--gs-shadow); touch-action: none;
      }
      .gs-bigmap svg { display: block; height: 100%; width: 100%; touch-action: none; }
      .gs-bigmap canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
      /* Map navigation overlay — floats on the map (top-right) so it needs no scrolling. */
      .gs-mapctrl {
        position: absolute; top: 8px; right: 8px; z-index: 5;
        display: flex; flex-direction: column; gap: 6px;
      }
      .gs-mapbtn {
        width: 38px; height: 38px; padding: 0; margin: 0;
        font: 600 17px/1 system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        border-radius: 9px; border: 1px solid var(--gs-line);
        background: rgba(17, 20, 27, .82); color: var(--gs-ink);
        cursor: pointer; -webkit-tap-highlight-color: transparent;
        touch-action: manipulation; user-select: none; -webkit-user-select: none;
        backdrop-filter: blur(2px);
        transition: filter .14s ease, border-color .14s ease, background .14s ease;
      }
      .gs-mapbtn:hover { filter: brightness(1.18); border-color: #46506a; }
      .gs-mapbtn:active { filter: brightness(.95); }
      .gs-mapbtn[disabled] { opacity: .4; cursor: default; filter: none; }
      .gs-mapbtn--on {
        border-color: var(--gs-accent); background: rgba(29, 74, 42, .9);
        box-shadow: 0 0 10px rgba(95, 212, 90, .25);
      }
      .gs-bottom { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px; }
      .gs-ctrlrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      /* Segmented aim control — one connected row of equal-width options (replaces three
         wrapping buttons). The active segment is the green selected-toggle. */
      .gs-seg {
        display: flex; width: 100%; border: 1px solid var(--gs-line);
        border-radius: var(--gs-r); overflow: hidden; background: #14171f;
      }
      .gs-segbtn {
        flex: 1; padding: 11px 6px; font: 600 14px/1 system-ui, sans-serif;
        background: transparent; color: var(--gs-dim); border: none;
        border-left: 1px solid var(--gs-line); cursor: pointer;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
        transition: background .14s ease, color .14s ease;
      }
      .gs-segbtn:first-child { border-left: none; }
      .gs-segbtn:active { background: #ffffff08; }
      .gs-segbtn--on {
        background: linear-gradient(180deg, #1d4a2a, #163a20); color: #ecffe9;
        box-shadow: inset 0 0 12px rgba(95, 212, 90, .18);
      }
      .gs-legend { font-size: 12px; margin: 1px 0; line-height: 1.45; opacity: .92; }
      /* Pull-to-power HUD (GS-power): a horizontal bar that fills as you drag DOWN on the map to
         charge power; the 100% tick marks a full swing (the bar can run past it with Overdrive). */
      .gs-power { margin: 1px 0 0; }
      .gs-powerbar {
        position: relative; height: 9px; border-radius: 5px; overflow: hidden;
        background: #14171f; border: 1px solid var(--gs-line);
      }
      .gs-powerfill {
        position: absolute; left: 0; top: 0; bottom: 0; width: 0;
        border-radius: 5px 0 0 5px; transition: width .04s linear, background .1s linear;
      }
      .gs-power100 {
        position: absolute; top: -2px; bottom: -2px; width: 2px; transform: translateX(-1px);
        background: rgba(255,255,255,.5); pointer-events: none;
      }
      .gs-powerlabel { font-size: 12px; margin-top: 2px; line-height: 1.25; }
      /* The map absorbs the pull gesture, so its touches are never page scrolls/zooms. */
      .gs-shot .gs-bigmap[data-map] { touch-action: none; }
      .gs-shot .gs-hitbar { display: flex; gap: 8px; }

      /* ===== Full-bleed immersive hole screen (GS-fullmap) =====================
         The hole map fills the WHOLE screen; every control + readout floats ON it as a
         translucent overlay, so nothing competes with the map for space. The page frame
         (.gs-main) drops its padding for this screen via .gs-main--bleed. */
      .gs-main--bleed { padding: 0; max-width: none; }
      .gs-main--wide { max-width: 1180px; }
      .gs-shot--full {
        position: relative; width: 100%;
        height: 100vh; height: 100dvh; overflow: hidden;
        display: block; gap: 0;
      }
      .gs-shot--full .gs-bigmap {
        position: absolute; inset: 0; border: none; border-radius: 0; box-shadow: none;
      }
      /* Overlays float above the map. Most are pass-through (pointer-events:none) so a pull
         can START anywhere on the map even under a readout; only real buttons capture taps. */
      .gs-hud { position: absolute; z-index: 6; pointer-events: none; }
      .gs-hud button, .gs-hud [data-cycle], .gs-hud [data-suggest], .gs-hud [data-aimreset],
      .gs-hud [data-action] { pointer-events: auto; }
      /* The putt-meter canvas is tapped to set pace, so it must capture pointers. */
      .gs-hud #puttmeter, .gs-hud #puttmeter canvas { pointer-events: auto; }
      /* The caddy badge stays pass-through so a power pull can START over it (it's only a portrait). */
      .gs-caddybadge, .gs-caddybadge canvas { pointer-events: none; }
      .gs-glass {
        background: rgba(10, 13, 19, .62); backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
        border: 1px solid rgba(255,255,255,.08); border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0,0,0,.35);
      }
      /* Top-left info chip — hole/par/distance/score + a thin lie·wind sub-line + pips. Kept tight
         (small padding/gaps) so it occludes as little of the shot-range cone behind it as possible. */
      .gs-hud-top {
        top: calc(8px + env(safe-area-inset-top)); left: 8px;
        right: 56px; /* clear the top-right nav column */
        padding: 5px 10px 6px;
      }
      .gs-hud-top .gs-stats {
        display: flex; align-items: center; gap: 9px 11px; flex-wrap: wrap;
        font-size: 13px; color: var(--gs-dim);
      }
      .gs-hud-top .gs-stats b { color: var(--gs-ink); }
      .gs-hud-top .gs-sub { font-size: 11.5px; opacity: .9; line-height: 1.35; margin-top: 3px;
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      /* Bottom control panel — caddy badge + club + power + spray odds. */
      .gs-hud-bottom {
        left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom));
        /* flex-end (not stretch) so the caddy badge + round button sit at their NATURAL height,
           bottom-aligned to the controls panel — the badge no longer stretches tall to match the
           controls column (the "caddy frame too tall for the graphic" bug). */
        display: flex; align-items: flex-end; gap: 8px;
      }
      /* Watch-screen caddy badge — the framed gold portrait floats bottom-RIGHT during the shot
         animation (GS-caddy-display), clear of the play view's bottom-left corner caddy + the
         top-left info chip, so the "premium hire" border reads the whole shot. */
      .gs-hud-watchcaddy {
        right: 8px; bottom: calc(8px + env(safe-area-inset-bottom));
        display: flex; align-items: flex-end;
      }
      .gs-hud-controls {
        flex: 1 1 auto; min-width: 0; padding: 7px 11px 8px;
        display: flex; flex-direction: column; gap: 5px;
      }
      .gs-clubrow { display: flex; align-items: center; gap: 7px; }
      .gs-clubrow .gs-clubname { flex: 1 1 auto; text-align: center; font-weight: 700;
        font-size: 15px; color: var(--gs-ink); min-width: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .gs-clubrow .gs-btn { margin: 0; padding: 9px 11px; font-size: 16px; }
      .gs-clubrow .gs-mini { padding: 7px 9px; font-size: 13px; }
      .gs-legend-line { font-size: 11.5px; line-height: 1.4; opacity: .95; }
      /* Caddy badge — the hired caddy, framed so it really stands out (GS-fullmap / GS-caddy-display):
         a glowing gold frame, a warm radial backdrop, and a slow rotating sheen behind the figure +
         a pulsing glow, so it reads as a "premium" hire, not a plain portrait. */
      .gs-caddybadge {
        position: relative; isolation: isolate; overflow: hidden;
        flex: 0 0 auto; width: 78px; padding: 5px 5px 4px;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        border-radius: 15px;
        border: 1.5px solid rgba(255, 220, 120, .8);
        background:
          radial-gradient(120% 85% at 50% 0%, rgba(255,206,92,.26), rgba(255,206,92,0) 62%),
          linear-gradient(180deg, rgba(52,40,16,.9), rgba(11,12,18,.9));
        box-shadow: 0 4px 18px rgba(0,0,0,.45), inset 0 0 16px rgba(255,200,90,.16);
        animation: gs-caddyglow 2.4s ease-in-out infinite;
      }
      /* Rotating gold sheen behind the figure (shows through the transparent canvas). */
      .gs-caddybadge::before {
        content: ''; position: absolute; inset: -45%; z-index: -1; pointer-events: none;
        background: conic-gradient(from 0deg,
          transparent 0deg, transparent 55deg, rgba(255,233,170,.42) 92deg,
          transparent 135deg, transparent 235deg, rgba(255,210,120,.22) 275deg, transparent 320deg);
        animation: gs-caddyspin 5s linear infinite;
      }
      .gs-caddybadge canvas, .gs-caddybadge .gs-caddyname { position: relative; z-index: 1; }
      .gs-caddybadge canvas { display: block; width: 64px; height: 60px; }
      .gs-caddybadge .gs-caddyname {
        font-size: 9.5px; font-weight: 800; letter-spacing: .03em; line-height: 1;
        color: #ffe6a3; margin-top: 1px; max-width: 72px; text-align: center;
        text-shadow: 0 0 6px rgba(255,196,84,.5);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      @keyframes gs-caddyglow {
        0%, 100% { box-shadow: 0 4px 18px rgba(0,0,0,.45), 0 0 0 0 rgba(255,205,90,0), inset 0 0 16px rgba(255,200,90,.16); border-color: rgba(255,214,102,.7); }
        50% { box-shadow: 0 5px 22px rgba(0,0,0,.5), 0 0 20px 2px rgba(255,200,90,.5), inset 0 0 22px rgba(255,212,112,.3); border-color: rgba(255,230,156,.98); }
      }
      @keyframes gs-caddyspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .gs-caddybadge { animation: none; }
        .gs-caddybadge::before { animation: none; }
      }
      /* Floating round action button (auto-finish) tucked by the controls. */
      .gs-roundbtn {
        flex: 0 0 auto; width: 40px; align-self: stretch; padding: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 17px; color: var(--gs-ink);
        border-radius: 12px; cursor: pointer;
      }
      .gs-roundbtn:active { filter: brightness(.9); }
      /* Hit is the dominant target; Auto-finish (a hole-skip) is half the width so a fat-finger
         tap lands on Hit, not on accidentally watching the whole hole auto-play. */
      .gs-shot .gs-hitbar .gs-btn { margin: 0; padding: 13px 10px; font-size: 16px; text-align: center; }
      .gs-shot .gs-hitbar .gs-btn--primary { flex: 2; }
      .gs-shot .gs-hitbar .gs-btn--ghost { flex: 1; }

      /* The club +/- arrows are the most-tapped control in a round — give them a comfortable
         44px-class touch target instead of inheriting the default button padding. */
      .gs-ctrlrow [data-cycle] { min-width: 46px; padding: 11px 8px; font-size: 17px; }

      /* Left-handed mode (GS-lefty): mirror the full-map HUD so the reach-critical chrome falls under
         a LEFT thumb, pairing with the mirrored golfer/caddy/spray-cone on the map. The floating nav
         column (overview/zoom/⚙) moves to the left edge, the top info chip swaps to the right to clear
         it, and the bottom panel reverses so the caddy badge sits right and the round action button
         lands on the left. The club ◄/► arrows are NOT reversed — their glyphs are directional. */
      .gs-shot--lefty .gs-mapctrl { right: auto; left: 8px; }
      .gs-shot--lefty .gs-hud-top { left: 56px; right: 8px; }
      .gs-shot--lefty .gs-hud-bottom { flex-direction: row-reverse; }

      /* Page never scrolls sideways — a fixed-width card a hair wider than a tiny viewport
         clips instead of creating a horizontal-scroll jiggle. */
