<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Always revalidate index.html so a new deploy never serves a stale page that
         points at a content-hashed asset that no longer exists (the assets themselves
         are safe to cache forever). Best-effort on GitHub Pages, where we don't control
         HTTP headers. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>The Far Carry</title>
    <!-- PWA: installable as an app. The manifest + icons are external files copied verbatim
         into dist/ (NOT inlined by vite-plugin-singlefile) — an install manifest can't be a
         data-URI. Hrefs are relative so they resolve under the Pages subpath (/golf-stars/). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Far Carry" />
    <style>
      /* ───────────────────────────────────────────────────────────────────────
         The Far Carry — design tokens + component classes (UI polish pass).
         The DOM shell (app.ts / cards.ts) is styled freely here; the SVG render
         layer is deterministic and untouched. Tokens live as CSS variables so the
         whole theme shifts from one place; component classes carry the hover/
         active/focus states that pure inline styles can't express.
         ─────────────────────────────────────────────────────────────────────── */
      :root {
        --gs-bg: #0b0d12;          /* app background (matches the intro sky handoff) */
        --gs-bg-2: #11141b;        /* card / panel fill */
        --gs-panel: #161b25;       /* slightly raised surface */
        --gs-ink: #e8e8ea;         /* primary text */
        --gs-dim: #9aa1ad;         /* muted text */
        --gs-line: #2a3142;        /* default border */
        --gs-line-2: #1c2029;      /* hairline / divider */
        --gs-accent: #5fd45a;      /* primary green (calls to action) */
        --gs-info: #9fd8e6;        /* info cyan */
        --gs-danger: #ff6b6b;      /* miss / penalty */
        --gs-gold: #e08a2b;        /* outpost / shards */
        --gs-warn: #ffc454;        /* spray edge / caution */
        --gs-r: 10px;              /* control radius */
        --gs-r-lg: 14px;           /* card radius */
        --gs-shadow: 0 2px 10px rgba(0, 0, 0, .45);
        color-scheme: dark;

        /* ── Reader controls (GS-a11y-readable-text) ────────────────────────────
           The player owns their own type. These four tokens are the ONLY way the
           app expresses a typeface or a UI size, so a settings toggle re-themes
           every screen at once — including the 660-odd hard-px sizes we are never
           going to hand-convert to rem.
             --gs-font    the family stack (swapped by .gs-readable)
             --gs-uiscale a whole-UI zoom: scales text AND touch targets together
             --gs-track   letter-spacing; --gs-wordspace word-spacing
           The spacing pair defaults to 0 so the normal theme is byte-for-byte the
           old rendering. See docs/decisions/accessibility.md. */
        --gs-font: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        /* THE ROOT ZOOM IS A PRODUCT OF TWO HALVES (GS-ui-display-scale). The player owns
           their type, so the display's share MULTIPLIES their choice and never replaces it:
             --gs-readerscale   the settings ladder, written by settings.ts
             --gs-displayscale  how much bigger this display is than the composed-for phone,
                                written by app/viewportFit.ts (the ONE module allowed to
                                compute a scaled viewport — GS-a11y-tight-fit)
           Everything downstream — `zoom`, --gs-vh, --gs-dvh, --gs-portrait-w, data-gs-fit —
           already reads the combined token, so this is the whole insertion point. */
        --gs-readerscale: 1;
        --gs-displayscale: 1;
        --gs-uiscale: calc(var(--gs-readerscale) * var(--gs-displayscale));
        --gs-track: 0em;
        --gs-wordspace: 0em;
        /* One screen height, expressed in the LAYOUT units a zoomed root lays out in.
           Every viewport-locked box uses these instead of raw 100vh/100dvh. */
        --gs-vh: calc(100vh / var(--gs-uiscale));
        --gs-dvh: calc(100dvh / var(--gs-uiscale));
        /* THE PORTRAIT FRAME, in ONE place (GS-play-desktop-frame · GS-startour-frame).
           The game is composed portrait. On anything that is not phone-portrait it keeps a portrait
           frame rather than growing sideways, and the frame's width is a fraction of the viewport
           HEIGHT so the composition scales with the display instead of being pinned to a px count.
           Two surfaces now use it — the full-bleed play screen and the free-roam star chart — which
           is exactly when it stops being a number and becomes a decision with one home.
           ⚠ IT IS DELIBERATELY NOT MULTIPLIED BY --gs-displayscale (GS-ui-display-scale). It is
           0.52 of a screen height and --gs-dvh already divides by the zoom, so the frame RENDERS
           at 0.52·H physical px whatever the display scale is: the frame keeps its 0.52 aspect and
           its drawn width, and only its CONTENTS get bigger. Multiply it back and the frame widens
           to 0.52·H·scale (562 → 719px at 1080p) and the play camera's aspect goes 0.52 → 0.67 —
           a wider camera on every desktop shot, which is the exact thing GS-play-desktop-frame's
           cap exists to prevent. */
        --gs-portrait-w: calc(var(--gs-dvh) * 0.52);
      }

      * { box-sizing: border-box; }
      /* `zoom` (not a transform) so the whole layout re-flows at the new size rather than
         being scaled as a picture — text stays crisp and buttons get genuinely bigger hit
         boxes. Every viewport-locked height below divides by the same token, because a
         `100dvh` box inside a zoomed root would otherwise measure 1 screen of ZOOMED units
         and hang off the bottom (it put the Swing button 185px below the fold at 1.25). */
      html { -webkit-text-size-adjust: 100%; zoom: var(--gs-uiscale); }
      body {
        margin: 0;
        background: var(--gs-bg);
        color: var(--gs-ink);
        /* The family lives HERE, not on .gs-main. Overlays (settings sheet, price notice,
           exit confirm, intro popovers) are rendered as SIBLINGS of <main> — with the stack
           on .gs-main they inherited the UA default and the entire settings sheet shipped in
           Times New Roman. Anything that is not inside <main> is still a reader's text. */
        font-family: var(--gs-font);
        letter-spacing: var(--gs-track);
        word-spacing: var(--gs-wordspace);
        /* A faint cosmic vignette so flat panels sit on a living sky, not a slab — and, over it,
           an actual STARFIELD (GS-space-sky, `src/render/spaceSky.ts`).

           `--gs-sky` is a seamless star tile handed over as a `url(…)` at boot. It is a background
           LAYER rather than a fixed element on purpose: `body`'s background propagates to the
           canvas, so it covers the whole viewport at any `--gs-uiscale` with no size to state (a
           fixed box inside a zoomed root does not measure the display — GS-a11y-scale-wrap), it
           needs no `z-index: -1` and nothing above it can bury it with a stacking context, and it
           does not have to be mounted outside `#app` to survive `render()`.

           The fallback is the POINT of writing it this way: `var(--gs-sky, none)` means a build
           where that boot call never runs falls back to exactly the old vignette, not to a hole.
           Star layer FIRST so it sits on top of the colour wash rather than under it, and
           `repeat` only for that layer — the two vignette blobs are single, placed washes. */
        background-image:
          var(--gs-sky, none),
          radial-gradient(1100px 620px at 78% -8%, #18203044 0%, transparent 60%),
          radial-gradient(900px 520px at 12% 4%, #1a162a3a 0%, transparent 58%);
        background-repeat: repeat, no-repeat, no-repeat;
        background-attachment: fixed;
      }
      .gs-main {
        font-family: var(--gs-font);
        max-width: 820px; margin: 0 auto;
        /* Respect the notch / home-indicator on installed PWAs (viewport-fit=cover). The
           top/bottom insets are mirrored in .gs-shot's height math below so the fixed play
           screen still fits exactly without scrolling. */
        padding:
          calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
        color: var(--gs-ink); min-height: var(--gs-vh);
        /* ── A SCREEN SITS IN THE MIDDLE OF THE ROOM (GS-page-centre) ──────────────────────
           `min-height` makes the page frame at least one viewport tall; every screen then
           stacked its content from the TOP of that frame and left the remainder black. On a
           phone that reads as "the screen is short". On a landscape viewport — the 820x760
           itch embed, a desktop browser, a tablet — it reads as broken: measured across the
           deep-linkable screens at 820x760, the round recap left 43% of the frame empty, the
           Trade Market 47%, the champion picker 59% and a Story beat 64%, with the content
           glued to the top edge of the void.

           `align-content` on a BLOCK container is the whole fix, and it is the reason this is
           one line rather than a pass over twenty screens. Flex or grid would centre too, but
           both would ALSO change what the children are: adjacent sibling margins stop
           collapsing (the title screen's five sections would gain ~48px between them) and
           every child becomes a flex/grid item with different sizing rules. Block alignment
           moves the stack and changes nothing else — measured content height is identical
           before and after.

           `safe`, never bare `center`: content taller than the frame must start at the top
           edge and scroll, never be centred with its head cut off (GS-a11y-sheet-scroll).
           Screens that already fill the frame — the full-bleed play screen, the viewport-locked
           roster, anything that scrolls — have no free space to distribute, so this is a no-op
           for them by construction. And on an engine without block-container alignment
           (pre-2024) it is simply ignored: the old top-anchored layout, never a broken one. */
        align-content: safe center;
      }
      /* ── IN AN EMBED, THE PAGE SCROLLS ITSELF (GS-embed-scroll) ───────────────────────────
         itch.io serves HTML5 games in an iframe with `scrolling="no"`, so the game's DOCUMENT
         cannot scroll: a wheel over the game scrolls the STORE PAGE behind it. Measured in that
         setup, the Pro Shop is 1388px of content in an 860px frame and 528px of it was simply
         unreachable — the rack ended. The shipyard, clubhouse, locker and Story bar all had it.

         Same rule the overlays already follow (GS-a11y-sheet-scroll): a box bigger than the
         viewport is unreachable content, so it caps itself to one screen and scrolls INSIDE.
         `overscroll-behavior-y: contain` stops the scroll chaining out to the store page when the
         rack ends, which is what made it feel like nothing was happening.

         Scoped to `[data-gs-embed]` — a self-scrolling page stops a mobile browser's address bar
         collapsing, which costs real screen in a context that was never broken.

         `--fit` and `--bleed` are excluded BY NAME: both are already exactly one screen tall and
         own their overflow (the viewport-locked roster deliberately hides it, the play frame has
         nothing to scroll), and this selector would otherwise out-specify them. */
      html[data-gs-embed] .gs-main:not(.gs-main--fit):not(.gs-main--bleed) {
        min-height: 0;
        height: var(--gs-vh);
        height: var(--gs-dvh);
        overflow-y: auto;
        overscroll-behavior-y: contain;
        /* Dressed like the game, not like the OS — the same slim treatment the viewport-locked
           roster already uses (`.gs-charwrap`). This scrollbar is INSIDE the frame, on the game's
           own dark chrome, so a default 15px light-grey one reads as browser furniture dropped on
           the art. It is also the reason to prefer this over the host's own scrollbars: those sit
           outside the game and cannot be styled from in here at all. */
        scrollbar-width: thin;
        scrollbar-color: var(--gs-line) transparent;
      }
      html[data-gs-embed] .gs-main::-webkit-scrollbar { width: 6px; }
      html[data-gs-embed] .gs-main::-webkit-scrollbar-track { background: transparent; }
      html[data-gs-embed] .gs-main::-webkit-scrollbar-thumb {
        background: var(--gs-line); border-radius: 3px;
      }
      html[data-gs-embed] .gs-main::-webkit-scrollbar-thumb:hover { background: #3a4356; }
      /* Headings keep their extra tracking ON TOP of the reader's, never instead of it. */
      .gs-main h1, .gs-main h2, .gs-main h3 { letter-spacing: calc(var(--gs-track) + .2px); }
      ::selection { background: #5fd45a44; }

      /* ── Focus ring, by DEFAULT (GS-a11y-focus) ──────────────────────────────────────────
         A bare `:focus-visible` is specificity (0,1,0) — lower than every `.gs-thing:focus-visible`
         rule below it — so this is a FLOOR, not an override: components keep their bespoke rings and
         everything else stops being invisible to a keyboard. It covers the set that had no ring at
         all (.gs-setchip, .gs-seg, .gs-setact, .gs-mapbtn, .gs-roundbtn, .gs-setrow, .gs-clickcard, .gs-traits-bar,
         .si-card …) and, more usefully, every control written from here on. */
      :focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }

      /* ── Reduced motion, from the SETTING (GS-a11y-motion) ────────────────────────────────
         The ~19 `@media (prefers-reduced-motion: reduce)` blocks below answer the OS. They cannot
         see the in-app toggle — so a player who turned "Reduced motion" on without an OS-level
         preference still got every entrance animation, sheen, drift and pulse in the app.

         This is the blunt instrument, and deliberately so: it fires only when the player has
         explicitly ASKED for calm, and at that point "some animations, tastefully reduced" is not
         what they asked for. The bespoke blocks below still run for the OS preference and do nicer
         things (fading sparks out rather than snapping them), so this never has to be clever.

         Durations go to ~0 rather than `animation: none`, because several entrance animations
         start at `opacity: 0` and would otherwise never arrive at their end state. */
      .gs-reduced *, .gs-reduced *::before, .gs-reduced *::after {
        animation-duration: .001ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        transition-delay: 0ms !important;
        scroll-behavior: auto !important;
      }

      /* Visually hidden, still announced (GS-a11y-announce). NOT `display:none` or
         `visibility:hidden` — both remove the node from the accessibility tree, which is exactly
         what a live region must not be. The 1px clipped box is the standard technique. */
      .gs-sr-only {
        position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
      }

      /* ── Reader-friendly type (GS-a11y-readable-text) ────────────────────────────────
         Set on <html> by the "Readable text" toggle. The full reasoning, with citations,
         is in docs/decisions/accessibility.md. The short version, because it drives what
         this rule does and does NOT do:

         WE DO NOT SHIP A DYSLEXIA FONT, and that is a considered decision, not a corner cut.
         The letterform-based faces (OpenDyslexic, Dyslexie) have been tested repeatedly and
         do not deliver a reading-speed or accuracy benefit — Rello & Baeza-Yates 2013 put
         OpenDyslexic BEHIND plain Arial and found readers preferred Verdana to it; Wery &
         Diliberto 2017 and Kuster et al. 2018 both found no gain. The two positive-looking
         results in the literature (Marinus 2016) resolved to the font's wider SPACING, not
         its shapes, and Galliussi et al. 2020 separated the two factorially and found only
         spacing mattered. OpenDyslexic is also ~113KB — in a build that inlines everything
         into one index.html and otherwise ships zero third-party binary assets.

         So this toggle buys the levers that DO replicate, all of which cost zero bytes:
           · letter spacing — Zorzi et al. 2012 (PNAS): extra tracking alone, with no
             training, gave ~20% faster reading and half the errors in dyslexic children.
             Dyslexic readers are unusually hurt by crowding; this is the big one.
           · word spacing — the BDA asks for ≥3.5× the letter spacing, which is what the
             ratio below is.
           · line spacing — BDA asks 1.5.
           · NO ITALICS — the most robust negative finding in the font literature (Rello &
             Baeza-Yates 2013: significantly worse on reading time AND fixation duration).
           · NO JUSTIFICATION — WCAG 1.4.8; uneven word gaps make "rivers".
         Values sit at/above WCAG 1.4.12's user-override bar (.12em letter, .16em word) but
         short of the BDA's most aggressive tracking, because this is a dense game HUD and
         over-spacing re-wraps the very rows GS-play-hud-space just un-wrapped.

         The FAMILY is a bonus, not the mechanism: we ask for the most legible faces already
         installed on the device (a reader who has OpenDyslexic or Atkinson Hyperlegible on
         their OS gets it for free), falling back to Verdana/Tahoma — tall x-height, wide
         sidebearings, open apertures, and the BDA's own named recommendations.

         Line-height is a FLOOR, not an override: every component that sets its own (most of
         the HUD, via the `font:` shorthand) keeps its tight line box, so the play screen
         does not reflow. */
      .gs-readable {
        --gs-font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Andika, OpenDyslexic,
                   Lexend, Verdana, Tahoma, "Trebuchet MS", "Segoe UI", Roboto, system-ui, sans-serif;
        --gs-track: .06em;
        --gs-wordspace: .21em;
      }
      .gs-readable body { line-height: 1.5; }
      /* Italics are the one letterform effect with solid evidence — and it is negative. Bold
         instead, which is what the BDA style guide asks for. */
      .gs-readable i, .gs-readable em, .gs-readable [style*="italic"] { font-style: normal; font-weight: 700; }
      .gs-readable [style*="text-align:justify"], .gs-readable [align="justify"] { text-align: left !important; }
      /* SVG TEXT IS GEOMETRY, NOT PROSE — the tracking must not reach it. `letter-spacing` and
         `word-spacing` are inherited properties, so the pair set on `body` reaches every `<text>` in
         every hole map, star chart and card illustration. Those labels are placed at coordinates and
         cannot wrap or reflow: widening them ran the travel map's three lane captions into each other
         and off the right edge of the chart, and pushes the hole map's yardage markers off the feature
         they annotate. The reader still gets the legible FAMILY here (that part inherits fine, and it is
         the part that survives on a fixed-position label); only the spacing is held back. */
      .gs-readable svg text, .gs-readable svg tspan { letter-spacing: normal; word-spacing: normal; }

      /* ── Buttons ─────────────────────────────────────────────────────────── */
      .gs-btn {
        font: 600 14px/1.15 var(--gs-font);
        padding: 9px 14px;
        border-radius: var(--gs-r);
        border: 1px solid var(--btn-border, var(--gs-line));
        background: linear-gradient(180deg, #232838, #191d27);
        color: var(--gs-ink);
        cursor: pointer;
        margin: 3px 4px 3px 0;
        -webkit-tap-highlight-color: transparent;
        /* manipulation kills the 300ms tap delay + double-tap-zoom on controls; no text
           selection so a fast tap or a map drag never selects a label. */
        touch-action: manipulation;
        user-select: none; -webkit-user-select: none;
        transition: transform .07s ease, box-shadow .16s ease,
                    border-color .16s ease, filter .16s ease, background .16s ease;
      }
      .gs-btn:hover {
        border-color: var(--btn-hover, #46506a);
        filter: brightness(1.13);
        box-shadow: 0 3px 14px rgba(0, 0, 0, .42);
      }
      .gs-btn:active { transform: translateY(1px); filter: brightness(.97); }
      .gs-btn:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }
      .gs-btn[disabled] {
        opacity: .5; cursor: default; filter: none; transform: none; box-shadow: none;
        background: #15171d; color: #6a7080; border-color: #22262f;
      }
      .gs-btn--block { display: block; width: 100%; text-align: left; }
      .gs-btn--primary {
        --btn-border: #2f8c3a;
        background: linear-gradient(180deg, #1f5e2d, #163a20);
        color: #ecffe9;
      }
      .gs-btn--primary:hover { --btn-hover: var(--gs-accent); box-shadow: 0 0 16px rgba(95, 212, 90, .32); }
      .gs-btn--ghost { background: linear-gradient(180deg, #1a1e27, #14171f); color: var(--gs-dim); }
      .gs-btn--ghost:hover { color: var(--gs-ink); }
      .gs-btn--on {
        --btn-border: var(--gs-accent);
        background: linear-gradient(180deg, #1d4a2a, #163a20);
        color: #ecffe9;
        box-shadow: 0 0 12px rgba(95, 212, 90, .22);
      }

      /* ── Panels, banners, chips ──────────────────────────────────────────── */
      .gs-panel {
        border: 1px solid var(--gs-line);
        border-radius: var(--gs-r-lg);
        background: linear-gradient(180deg, #141823, var(--gs-bg-2));
        padding: 12px 14px; margin: 8px 0;
        box-shadow: var(--gs-shadow);
      }
      /* ── Ship fuel (GS-fuel-2): the segmented tank gauge + the Fuel Depot panel. The gauge is a
             row of glowing fuel CELLS (--fuel-col set inline: cyan → amber → red as it drains) so
             the tank reads at a glance on a phone; the mini variant rides the run header. The
             depot is a proper spaceport counter — panel-framed, price up front — not a text box. ── */
      .gs-fuelbar { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
      .gs-fuelbar__ico { line-height: 1; }
      .gs-fuelbar__cells {
        display: inline-flex; gap: 2px; padding: 2.5px 3px;
        border: 1px solid var(--gs-line); border-radius: 5px; background: #0a0e16;
      }
      .gs-fuelbar__cell { width: 7px; height: 12px; border-radius: 2px; background: #1d2331; }
      .gs-fuelbar__cell--lit { background: var(--fuel-col); box-shadow: 0 0 5px var(--fuel-col); }
      .gs-fuelbar__n { font-size: 13px; }
      .gs-fuelbar__over {
        font-size: 10px; font-weight: 800; color: #4fd0e0; border: 1px solid #4fd0e055;
        border-radius: 999px; padding: 0 5px;
      }
      .gs-fuelbar--mini { gap: 4px; }
      .gs-fuelbar--mini .gs-fuelbar__cells { padding: 2px; gap: 1.5px; }
      .gs-fuelbar--mini .gs-fuelbar__cell { width: 4.5px; height: 9px; border-radius: 1.5px; }
      .gs-fuelbar--mini .gs-fuelbar__n { font-size: 12px; }
      /* Vertical variant (GS-journey-map-redesign / GS-journey-hud): a fuel COLUMN — the COUNT on top,
         cells stacked and filling from the BOTTOM up (column-reverse, since the lit cells lead the DOM),
         the ⛽ icon anchored at the FOOT. Rides the right pillar of the bridge HUD. */
      .gs-fuelbar--vert { flex-direction: column; gap: 3px; }
      .gs-fuelbar--vert .gs-fuelbar__cells { flex-direction: column-reverse; padding: 3px; gap: 2.5px; }
      .gs-fuelbar--vert .gs-fuelbar__cell { width: 14px; height: 7px; border-radius: 2px; }
      .gs-fuelbar--vert .gs-fuelbar__n { font-size: 13px; font-variant-numeric: tabular-nums; }
      .gs-fuelbar--vert .gs-fuelbar__ico { font-size: 15px; }
      .gs-fuelbar--vert .gs-fuelbar__over { order: -1; }
      .gs-fueldepot {
        display: flex; flex-direction: column; gap: 8px;
        border: 1px solid #4fd0e044; border-left: 4px solid #4fd0e0aa;
        border-radius: var(--gs-r-lg); padding: 10px 12px; margin: 12px 0 0;
        background: linear-gradient(180deg, #12202a, #0e141d);
      }
      .gs-fueldepot__head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .gs-fueldepot__title { font-size: 14px; font-weight: 800; color: #4fd0e0; letter-spacing: .03em; }
      .gs-fueldepot__price { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--gs-dim); white-space: nowrap; }
      .gs-fueldepot__row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .gs-fueldepot__row .gs-btn { flex: 1 1 auto; font-size: 13px; padding: 9px 10px; text-align: center; }
      .gs-fueldepot__note { font-size: 11.5px; opacity: .6; margin: 0; }
      /* Compact Fuel Depot (GS-shop-stop-layout): rides the shop's top row beside Travel Onward — a
         tighter header, gauge on its own line, and the quick-buy buttons STACKED to fit the narrow
         half-column. Margin reset so it sits flush in the grid cell. */
      .gs-fueldepot--compact { margin: 0; gap: 6px; padding: 10px 11px; }
      .gs-fueldepot--compact .gs-fueldepot__title { font-size: 13px; }
      .gs-fueldepot__gauge { display: flex; }
      .gs-fueldepot__meta { display: flex; align-items: center; min-height: 16px; }
      .gs-fueldepot__meta .gs-fueldepot__price { margin-left: 0; }
      .gs-fueldepot__row--stack { flex-direction: column; align-items: stretch; gap: 6px; }
      .gs-fueldepot__row--stack .gs-btn,
      .gs-fueldepot__row--stack > span { flex: 1 1 auto; width: 100%; }
      /* ── Stop intro (GS-intro-split): two mobile-first steps — the ARC (mode + field of
             competitors) then the HOLE (map + hazards popup). Each step is built to hold one
             phone screen; the arc's field of 20 sits behind a tap-to-open SCOUT bar (one CTA, no
             duplicate), and the hole map is viewport-capped so its action row stays on-screen. ── */
      .gs-intro-ctarow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
      .gs-intro-first { flex: 1 1 auto; min-width: 160px; text-align: center; font-size: 16px; padding: 14px 18px; }
      .gs-intro-scout { margin-top: 14px; }
      .gs-holeintro { display: flex; flex-direction: column; gap: 10px; }
      .gs-holeintro-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
      .gs-holeintro-boss {
        font-size: 12px; font-weight: 700; letter-spacing: .04em; border: 1px solid; border-radius: 8px;
        padding: 5px 10px; background: linear-gradient(180deg, #1a0e12, #120b10);
      }
      .gs-holeintro-map {
        border-radius: 12px; overflow: hidden; border: 1px solid var(--gs-line-2);
        line-height: 0; background: #0d1016;
      }
      .gs-holeintro-map svg { display: block; width: 100%; height: auto; max-height: calc(var(--gs-dvh) * .44); margin: 0 auto; }
      .gs-holeintro-ctas { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .gs-holeintro-ctas .gs-btn { flex: 1 1 auto; text-align: center; }
      .gs-holeintro-ctas .gs-btn--primary { flex: 2 1 40%; font-size: 16px; padding: 13px 16px; }
      .gs-holeintro-back { flex: 0 0 auto; }
      .gs-traits-bar {
        display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px;
        border: 1px solid var(--gs-line-2); border-radius: 10px; background: #ffffff06;
        color: var(--gs-ink); cursor: pointer; font: inherit; text-align: left;
      }
      .gs-traits-bar:hover { border-color: var(--gs-line); background: #ffffff0d; }
      .gs-traits-bar:active { transform: translateY(1px); filter: brightness(.97); }
      .gs-trait-chip { display: inline-flex; align-items: center; gap: 6px; }
      .gs-trait-chip-i { font-size: 15px; }
      .gs-trait-chip-l { font-size: 11.5px; font-weight: 700; color: var(--tc); letter-spacing: .02em; }
      .gs-traits-bar-more { margin-left: auto; font-size: 11.5px; opacity: .6; white-space: nowrap; }
      /* ── Title screen (GS-title-2): hero wordmark, section labels, and the game-mode tiles.
             The mode tiles speak the SAME painted-scene + caption language as the Market/Clubhouse
             doorways (one visual family) but are unmistakably the games: taller, accent-bordered
             (--mc = mode accent), badged, and carrying a launch bar. The whole tile is the button. ── */
      .gs-hero { text-align: center; padding: 4px 0 2px; }
      .gs-hero-title {
        margin: 0; font-size: 34px; letter-spacing: .045em; line-height: 1.1;
        color: #ecffe9;
        text-shadow: 0 0 22px rgba(95, 212, 90, .38), 0 0 44px rgba(255, 206, 84, .18);
      }
      .gs-hero-tag {
        margin: .45em 0 0; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
        color: var(--gs-dim); text-wrap: balance;
      }
      /* ── Crash toast (GS-crash-diagnostics) — its OWN `.gs-crash*` prefix, never the play
         screen's `.gs-hud*`, which is the class collision that caused the #353 map-blur bug.
         Fixed to the bottom above the play controls, `pointer-events:none` on the host so an
         empty toast can never eat a tap meant for the game beneath it. Uses --gs-dvh's sibling
         units only; no raw viewport units (GS-a11y-sheet-scroll). */
      .gs-crash { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9000; pointer-events: none; }
      .gs-crash__bar {
        pointer-events: auto; margin: 0 auto 10px; max-width: min(560px, calc(100% - 20px));
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 9px 12px; border-radius: 10px;
        background: #2a1416; border: 1px solid #7a3b40; color: #ffd9d9;
        box-shadow: 0 6px 22px rgba(0, 0, 0, .55); font-size: 13px;
      }
      .gs-crash__msg { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
      .gs-crash__btn {
        flex: 0 0 auto; font: inherit; font-family: var(--gs-font);
        padding: 6px 10px; border-radius: 8px; cursor: pointer;
        background: #43201f; border: 1px solid #8d4a4a; color: #ffe6e6;
      }
      .gs-crash__btn:hover { filter: brightness(1.15); }
      .gs-crash__btn:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }
      .gs-crash__btn--x { padding: 6px 9px; }
      /* The manual-copy fallback, shown only when the clipboard API refuses. Monospace would suit a
         stack trace, but a `font:` shorthand RESETS the family and the Readable-text toggle could
         never reach it (GS-a11y-readable-text) — and this box exists to be read by someone already
         having a bad time. The token wins; the text is select-and-copy, so column alignment is not
         load-bearing. */
      .gs-crash__text {
        flex: 1 0 100%; margin-top: 6px; min-height: 88px; resize: vertical;
        font: 11px/1.45 var(--gs-font);
        background: #160b0c; color: #ffd9d9; border: 1px solid #7a3b40; border-radius: 8px; padding: 6px;
      }

      /* The build stamp (GS-release-identity) — deliberately the quietest text on the screen.
         It has to be READABLE when someone is copying it into a bug report, so it is dimmed
         and small rather than hidden; `tabular-nums` keeps the digits legible at this size. */
      .gs-hero-build {
        margin: .5em 0 0; font-size: 10px; letter-spacing: .14em;
        color: var(--gs-dim); opacity: .62; font-variant-numeric: tabular-nums;
      }
      .gs-hero-chips { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      /* GS-save-durability: the "this browser isn't saving" alert. Deliberately the loudest thing on
         the title — it is the only message where ignoring it costs the player everything they then
         go on to do. No fixed height and `overflow-wrap` so it survives the top Readable-text rung
         (GS-a11y-scale-wrap); no viewport units anywhere (GS-a11y-sheet-scroll). */
      .gs-storagewarn {
        margin: 12px auto 0; max-width: 560px; padding: 10px 12px; border-radius: 10px;
        border: 1px solid #6b2b2b; background: #2a1414; color: #ffd9d9;
        font-size: 13px; line-height: 1.45; text-align: left; overflow-wrap: anywhere;
      }
      .gs-storagewarn b { color: #ff9b9b; }
      .gs-storagewarn__do { display: block; margin-top: 6px; color: #ffeaea; }
      .gs-storagewarn__do b { color: #fff; }
      /* The reason on the install button — quieter than the label it qualifies, and it drops away
         where the button would otherwise wrap the chips row onto a second line. */
      .gs-installwhy { opacity: 0.72; font-size: 0.9em; }
      @media (max-width: 460px) { .gs-installwhy { display: none; } }
      .gs-seclabel {
        font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase;
        color: var(--gs-dim); margin: 20px 0 8px;
        display: flex; align-items: center; gap: 10px;
      }
      .gs-seclabel::after { content: ''; flex: 1; height: 1px; background: var(--gs-line-2); }
      /* ── Character-select difficulty picker (GS-title-2): Ascension chips, chosen with the golfer ── */
      .gs-ascpick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
      .gs-ascpick-l { flex: 0 0 auto; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--gs-gold); }
      /* Chips ride a single fixed-height strip that scrolls sideways rather than wrapping to a new
         row — so more unlocked tiers never reflow the roster below or resize the screen (GS-title-2). */
      .gs-ascpick-chips {
        flex: 1 1 auto; min-width: 0; display: flex; gap: 5px;
        overflow-x: auto; overflow-y: hidden; padding-bottom: 2px;
        scrollbar-width: thin; -webkit-overflow-scrolling: touch;
      }
      .gs-ascpick-chip { flex: 0 0 auto; padding: 6px 11px; font-size: 12.5px; margin: 0; }
      .gs-ascpick-hint { flex-basis: 100%; font-size: 10.5px; opacity: .55; }
      /* ── Character-select difficulty PILLS (GS-diffpills): compact native-select dropdowns that fit one
         mobile row and never reflow the roster below (the OS supplies the picker on tap). ── */
      .gs-diffrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 2px; }
      .gs-selpill {
        position: relative; display: inline-flex; align-items: center; gap: 5px;
        padding: 5px 8px 5px 11px; border-radius: 999px;
        border: 1px solid var(--cc, var(--gs-line)); background: var(--gs-bg-2); box-shadow: var(--gs-shadow);
      }
      .gs-selpill-l { font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--cc, var(--gs-gold)); white-space: nowrap; }
      .gs-selpill-sel {
        appearance: none; -webkit-appearance: none; background: transparent; border: 0; outline: none;
        color: var(--gs-ink); font: 800 13px/1 var(--gs-font); padding: 3px 17px 3px 2px; cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .gs-selpill-sel option { color: #111; background: #fff; }
      .gs-selpill-caret { position: absolute; right: 10px; pointer-events: none; opacity: .65; font-size: 10px; color: var(--cc, var(--gs-ink)); }
      .gs-diffrow-hint { flex-basis: 100%; font-size: 10.5px; opacity: .55; }
      /* Keep the difficulty hint to a single line on phones so it doesn't steal a card row of height. */
      @media (max-width: 640px) {
        .gs-select .gs-diffrow-hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      }
      /* The per-golfer club-unlock badge on the select card (GS-ascension-clubs display): does a win at the
         selected Ascension grow THIS golfer's bag? green = yes, dim = already cleared, gold = bag full. */
      .gs-unlock-badge { font-size: 10px; font-weight: 800; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
      .gs-unlock-badge--go { color: #07120a; background: var(--gs-accent); }
      .gs-unlock-badge--wait { color: var(--gs-dim); background: #ffffff10; border: 1px solid var(--gs-line-2); }
      .gs-unlock-badge--full { color: #1a1400; background: var(--gs-gold); }
      .gs-chip {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 13px; padding: 4px 10px; border-radius: 999px;
        border: 1px solid var(--gs-line); background: #ffffff08;
      }
      .gs-clickcard { transition: transform .12s ease, filter .16s ease; }
      .gs-clickcard:hover { transform: translateY(-3px); filter: brightness(1.08); }
      .gs-clickcard:active { transform: translateY(-1px); }

      /* ── Collapsible section (Trade Market accordion) ────────────────────── */
      .gs-acc {
        border: 1px solid var(--gs-line); border-radius: var(--gs-r-lg);
        background: var(--gs-bg-2); margin: 10px 0; overflow: hidden;
      }
      .gs-acc__head {
        width: 100%; display: flex; align-items: center; gap: 9px;
        padding: 11px 14px; border: 0; cursor: pointer;
        background: linear-gradient(180deg, #161b25, #12151d);
        color: var(--gs-ink); font: inherit; text-align: left;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: background .16s ease;
      }
      .gs-acc__head:hover { background: linear-gradient(180deg, #1b2130, #141823); }
      .gs-acc__head:focus-visible { outline: 2px solid var(--gs-info); outline-offset: -2px; }
      .gs-acc__icon { font-size: 17px; line-height: 1; }
      .gs-acc__title { font-size: 15px; font-weight: 700; }
      .gs-acc__count {
        font-size: 11.5px; color: var(--gs-dim); font-variant-numeric: tabular-nums;
        border: 1px solid var(--gs-line); border-radius: 999px; padding: 1px 8px;
      }
      .gs-acc__chev {
        margin-left: auto; font-size: 13px; color: var(--gs-dim);
        transition: transform .2s ease;
      }
      .gs-acc--collapsed .gs-acc__chev { transform: rotate(-90deg); }
      .gs-acc__body { padding: 8px 10px 12px; }
      .gs-acc--collapsed .gs-acc__body { display: none; }
      .gs-acc__blurb { font-size: 12px; opacity: .6; margin: .2em 0 .6em; text-align: center; }
      .gs-acc__rack { display: flex; flex-wrap: wrap; justify-content: center; }
      /* Pro Shop accordion (GS-pro-shop-redesign): a per-panel rarity accent tints the header edge so
         the shop / bag / upgrades panels read as distinct cards. */
      .gs-acc--shop { border-color: color-mix(in srgb, var(--acc-accent, var(--gs-line)) 40%, var(--gs-line)); }
      .gs-acc--shop .gs-acc__head { border-left: 3px solid var(--acc-accent, transparent); }
      .gs-acc--shop .gs-acc__icon { color: var(--acc-accent, inherit); }

      /* ── Shop-stop top row (GS-shop-stop-layout): the Travel-Onward hero button beside a compact
             Fuel Depot, so the next action + the tank live together at the top of the screen. ─── */
      .gs-shoptop {
        /* `auto-fit` + `minmax(min(…))`, not `1fr 1fr`: a bare `1fr` keeps a min-content floor, and at a
           large UI scale the two halves both wanted more than half — the hero CTA's own
           `overflow: hidden` then clipped it to "Trave / onwa". Now the pair stacks when the row can no
           longer carry both. A breakpoint can't make this call: it can't see `--gs-uiscale`. */
        display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 10px;
        align-items: stretch; margin: 6px 0 12px;
      }
      /* Travel Onward — the whole card is the primary CTA: a starfield ship-art banner over a green
         label bar, so the jump reads as the hero action it is. */
      .gs-travelcard {
        display: flex; flex-direction: column; overflow: hidden; cursor: pointer;
        border: 1px solid #2f8c3a; border-radius: var(--gs-r-lg); box-shadow: var(--gs-shadow);
        background: linear-gradient(180deg, #1f5e2d, #163a20); color: #ecffe9;
        font: inherit; text-align: left; padding: 0;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
        transition: transform .07s ease, box-shadow .16s ease, border-color .16s ease, filter .16s ease;
      }
      .gs-travelcard:hover { border-color: var(--gs-accent); filter: brightness(1.08); box-shadow: 0 0 16px rgba(95, 212, 90, .32); }
      .gs-travelcard:active { transform: translateY(1px); filter: brightness(.97); }
      .gs-travelcard:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }
      .gs-travelcard__art { display: block; flex: 1 1 auto; min-height: 58px; line-height: 0; }
      .gs-travelcard__art svg { width: 100%; height: 100%; }
      .gs-travelcard__body { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px 11px; }
      .gs-travelcard__k { font-size: 15px; font-weight: 800; letter-spacing: .01em; overflow-wrap: anywhere; }
      .gs-travelcard__sub { font-size: 11.5px; opacity: .82; }

      /* ── Combined Pro Shop intro (GS-shop-stop-layout): the pro greeting + credits purse + reroll
             open the same Pro Shop panel as the stock rack — "Pro & Pro Shop as one". ─────────── */
      .gs-proshop__pro { display: flex; gap: 12px; align-items: center; margin-bottom: 4px; }
      .gs-proshop__ava { flex: 0 0 auto; }
      .gs-proshop__say { flex: 1 1 auto; min-width: 0; }
      .gs-proshop__name { font-weight: 700; font-size: 15px; }
      .gs-proshop__role { font-size: 11px; opacity: .6; margin-bottom: 5px; }
      .gs-proshop__line { font-size: 13px; font-style: italic; opacity: .92; line-height: 1.4; }
      .gs-proshop__bar {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 9px 0; margin-bottom: 4px; border-top: 1px solid var(--gs-line-2); border-bottom: 1px solid var(--gs-line-2);
      }
      .gs-proshop__purse {
        font-size: 13px; font-weight: 700; color: var(--gs-dim);
        display: inline-flex; align-items: baseline; gap: 4px;
      }
      .gs-proshop__purse b { color: var(--gs-warn); font-size: 17px; }
      .gs-proshop__cta { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

      /* ── Fuel depot state tag + upgrades digest (GS-pro-shop-redesign) ─────── */
      .gs-fueldepot__state { font-size: 12px; font-weight: 800; }
      .gs-upchips { display: flex; flex-wrap: wrap; gap: 7px; }
      .gs-upchip {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 12px; font-weight: 600; padding: 5px 10px 5px 8px;
        border: 1px solid var(--gs-line); border-radius: 999px; background: #ffffff08;
      }
      .gs-upchip__i { font-size: 14px; line-height: 1; }
      .gs-updetail__toggle {
        display: block; margin: 11px 0 0; padding: 6px 2px; border: 0; background: none;
        color: var(--gs-info); font: 600 12px/1.2 inherit; cursor: pointer;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      }
      .gs-updetail__toggle:hover { text-decoration: underline; }
      .gs-updetail__body {
        margin-top: 6px; padding: 10px 12px; border: 1px solid var(--gs-line-2);
        border-radius: 10px; background: #ffffff05;
      }
      .gs-updetail__body ul { list-style: none; }

      /* ── Settings cog (fixed, top-right) ─────────────────────────────────── */
      .gs-cog {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: calc(12px + env(safe-area-inset-right));
        z-index: 60;
        width: 42px; height: 42px;
        display: flex; align-items: center; justify-content: center;
        font-size: 22px; line-height: 1;
        border-radius: 50%;
        border: 1px solid var(--gs-line);
        background: radial-gradient(circle at 40% 35%, #232838, #14171f);
        color: var(--gs-dim); cursor: pointer; box-shadow: var(--gs-shadow);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: transform .25s ease, color .16s ease, border-color .16s ease, filter .16s ease;
      }
      .gs-cog:hover { color: var(--gs-ink); border-color: #46506a; filter: brightness(1.1); transform: rotate(50deg); }
      .gs-cog:active { filter: brightness(.95); }
      .gs-cog:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }

      /* ── Nav doorways: the Trade Market / Clubhouse tiles on the title ────── */
      .gs-navtiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0 16px; }
      @media (max-width: 460px) { .gs-navtiles { grid-template-columns: 1fr; } }
      /* Phones: tighten the title's vertical rhythm so all four stacked doorways + hero fit one
         screen without a scroll (the tiles stack 1-up here, so 150px each overruns short phones). */
      @media (max-width: 460px) {
        .gs-seclabel { margin: 13px 0 6px; }
        .gs-navtiles { margin: 8px 0 12px; }
        .gs-hero-chips { margin-top: 8px; }
      }
      .gs-navtile {
        position: relative; display: block; width: 100%; min-height: 134px; padding: 0;
        border-radius: var(--gs-r-lg); border: 1px solid var(--gs-line);
        background: var(--gs-bg-2); color: var(--gs-ink); cursor: pointer; overflow: hidden;
        text-align: left; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        box-shadow: var(--gs-shadow);
        transition: transform .14s ease, box-shadow .18s ease, border-color .16s ease, filter .16s ease;
      }
      .gs-navtile:hover { transform: translateY(-3px); border-color: #46506a; filter: brightness(1.05); box-shadow: 0 8px 22px rgba(0, 0, 0, .5); }
      .gs-navtile:active { transform: translateY(-1px); }
      .gs-navtile:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }
      .gs-navtile__art { position: absolute; inset: 0; display: block; }
      .gs-navtile__art svg { display: block; width: 100%; height: 100%; }
      .gs-navtile__cap {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: flex; flex-direction: column; gap: 2px; padding: 28px 14px 12px;
        background: linear-gradient(180deg, transparent, rgba(8, 9, 14, .88) 62%);
      }
      /* Long single words ("Unending", "Destination") must break rather than spill out of a tile
         that is `overflow: hidden` (GS-a11y-scale-wrap). A tile can get genuinely narrow — the
         3-up games row is pinned to three columns, and the UI-scale setting shrinks the LAYOUT
         viewport, so at 1.45x on a 390px phone each tile is ~69 layout px and the title clipped.
         `anywhere` (not `break-word`) so it also shrinks the box for the grid's min-content sizing. */
      .gs-navtile__title { font: 700 18px/1.1 var(--gs-font); overflow-wrap: anywhere; }
      .gs-navtile__sub { font-size: 12px; opacity: .82; overflow-wrap: anywhere; }
      /* ACCENT tiles (GS-title-2): the Voyage / Unending game doorways AND the Trade Market /
         Clubhouse between-run doorways share one component, distinguished only by the `--mc`
         accent on border + title (gold / violet / trade-teal / green). Game tiles set --mc inline. */
      .gs-navtile--market { --mc: #39d9c4; }
      .gs-navtile--clubhouse { --mc: #7ed957; }
      .gs-navtile--game, .gs-navtile--market, .gs-navtile--clubhouse {
        min-height: 150px; border-color: color-mix(in srgb, var(--mc) 45%, var(--gs-line));
      }
      .gs-navtile--game:hover, .gs-navtile--market:hover, .gs-navtile--clubhouse:hover { border-color: var(--mc); }
      .gs-navtile--game .gs-navtile__title,
      .gs-navtile--market .gs-navtile__title,
      .gs-navtile--clubhouse .gs-navtile__title { color: var(--mc); text-shadow: 0 0 14px color-mix(in srgb, var(--mc) 40%, transparent); }
      /* Phones: the four accent doorways stack 1-up, so 150px each overruns short screens — trim
         their height (and the caption's top padding to match) so the whole title fits, no scroll.
         Placed AFTER the 150px rule above so it wins on equal specificity. */
      @media (max-width: 460px) {
        .gs-navtile--game, .gs-navtile--market, .gs-navtile--clubhouse { min-height: 122px; }
        .gs-navtile__cap { padding-top: 22px; padding-bottom: 10px; }
      }

      /* ── Star Tour title row (GS-star-tour): three game modes across the top ──── */
      .gs-navtiles--games { grid-template-columns: repeat(3, 1fr); }
      @media (max-width: 460px) {
        /* Keep the three game tiles as a compact 3-up row on phones (override the 1-up base rule),
           trimmed so all five title buttons fit; the two doorways below stay 1-up. */
        .gs-navtiles--games { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .gs-navtiles--games .gs-navtile--game { min-height: 128px; }
        .gs-navtiles--games .gs-navtile__title { font-size: 13px; }
        .gs-navtiles--games .gs-navtile__sub { font-size: 10px; line-height: 1.15; }
        .gs-navtiles--games .gs-navtile__cap { padding: 16px 8px 9px; }
      }
      /* ⚠ MEDIA QUERIES ARE BLIND TO `--gs-uiscale` (GS-a11y-scale-wrap). Root `zoom` shrinks the
         layout BOX every element is laid out in — a 3-up grid really does get ~69px columns at 1.45x
         — but it does NOT move the media-query viewport: `matchMedia('(max-width:320px)')` is still
         false on a 375px phone at any scale. So a breakpoint can never be the answer to "this is too
         cramped at large text"; the content itself has to cope. Hence `overflow-wrap: anywhere` on
         the tile text above rather than a narrow-viewport rule that would never fire. */

      /* ── Continue Run button (GS-continue-button): the thematic, mode-aware resume card ──
         The character's cosmetic ship on the left, a mode-aware message (Voyage arc / Unending hole /
         Star Tour course + hole) on the right; the whole card is the resume button. Its OWN class
         prefix (never the play HUD's `.gs-hud`) — new title chrome gets a fresh prefix. */
      .gs-resume {
        display: flex; align-items: center; gap: 14px; width: 100%;
        margin: 4px 0 2px; padding: 10px 14px 10px 8px;
        border-radius: var(--gs-r-lg); border: 1px solid #2bb673; cursor: pointer; text-align: left;
        color: var(--gs-ink); -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        background: linear-gradient(180deg, #10241a, #0e1a14);
        box-shadow: var(--gs-shadow);
        transition: transform .14s ease, box-shadow .18s ease, border-color .16s ease, filter .16s ease;
      }
      .gs-resume:hover { transform: translateY(-2px); border-color: #46e0a0; filter: brightness(1.06); box-shadow: 0 8px 22px rgba(0,0,0,.5); }
      .gs-resume:active { transform: translateY(0); }
      .gs-resume:focus-visible { outline: 2px solid var(--gs-info); outline-offset: 2px; }
      .gs-resume__ship {
        flex: 0 0 auto; width: 96px; height: 60px; display: block; border-radius: 10px;
        background: radial-gradient(120% 120% at 60% 30%, rgba(43,182,115,0.16), rgba(6,12,9,0.55));
      }
      .gs-resume__ship svg { display: block; width: 100%; height: 100%; }
      .gs-resume__body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
      .gs-resume__kicker { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: #7fe0b0; opacity: .9; }
      .gs-resume__head { font: 800 20px/1.15 var(--gs-font); color: var(--gs-ink); }
      .gs-resume__sub { font-size: 12px; color: var(--gs-dim); }
      .gs-resume__go { flex: 0 0 auto; font-size: 20px; color: #46e0a0; padding-right: 4px; }
      @media (max-width: 460px) {
        .gs-resume { gap: 11px; padding: 8px 12px 8px 6px; }
        .gs-resume__ship { width: 78px; height: 50px; }
        .gs-resume__head { font-size: 18px; }
      }

      /* ── Star Tour: the free-roam star map course picker (GS-star-tour) ───────── */
      /* Deep-space starfield backdrop (GS-star-map-bigger-canvas): the chart is bigger than any phone
         screen and pans, but when zoomed all the way out it fits with letterbox margins. Rather than
         leave those margins flat black, the container + viewport carry a matching deep-space gradient
         with a faint tiled starfield, so the WHOLE screen reads as continuous starry space — the chart's
         own dense starfield sits in the middle, this fills everything around it. Fixed to the element
         (not scrolled), so it reads as distant background stars behind the moving chart. */
      .gs-st-space {
        background-color: #05060f;
        background-image:
          radial-gradient(1.4px 1.4px at 38px 52px, rgba(255,255,255,0.85), transparent),
          radial-gradient(1px 1px at 150px 128px, rgba(206,224,255,0.7), transparent),
          radial-gradient(1.2px 1.2px at 244px 210px, rgba(255,255,255,0.75), transparent),
          radial-gradient(1px 1px at 92px 268px, rgba(255,240,207,0.6), transparent),
          radial-gradient(1.6px 1.6px at 312px 76px, rgba(255,255,255,0.9), transparent),
          radial-gradient(1px 1px at 356px 296px, rgba(188,212,255,0.6), transparent),
          radial-gradient(ellipse 120% 100% at 50% 42%, #141a33 0%, #0c1024 55%, #05060f 100%);
        background-size: 384px 340px, 384px 340px, 384px 340px, 384px 340px, 384px 340px, 384px 340px, cover;
        background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, no-repeat;
      }
      .gs-startour { position: fixed; inset: 0; overflow: hidden; z-index: 1; }
      .gs-startour__viewport {
        position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        /* We drive pan + pinch-zoom ourselves via pointer events (GS-star-tour), so disable native
           touch panning/zoom — it used to jitter into the drag handler on a second finger (the pinch
           "flicker jump"). Wheel + scrollbar still scroll (touch-action only gates touch). */
        touch-action: none;
      }
      /* Plain block scroll-child. When the player zooms OUT past cover so the chart is smaller than the
         viewport in an axis, it's CENTRED (letterboxed) via JS-computed explicit margins (GS-star-map-
         zoom-out) — NOT flexbox, whose `align-items:stretch` distorted the SVG's aspect (the "map broke,
         ship jumps, pinch dead" regression). When the chart overflows, the margins are 0 and it scrolls
         from the top-left exactly as before. */
      .gs-startour__chart { display: block; }
      /* The SPACEPORT is a tappable "leave to Clubhouse" station (GS-star-tour-port) — a soft hover glow so
         it reads as an interactive dock, not just a landmark. */
      .gs-st-port { transition: filter .16s ease; }
      .gs-st-port:hover { filter: brightness(1.18) drop-shadow(0 0 10px rgba(57,217,196,0.65)); }
      .gs-st-port__halo { transition: opacity .3s ease; }
      .gs-st-port:hover .gs-st-port__halo { opacity: 0.6; }
      /* Engine plume — hidden on a docked/idle ship, faded in by the rAF loop while cruising. */
      .gs-st-thrust { opacity: 0; transition: opacity .18s ease-out; }
      #gs-st-ship.gs-st-thrusting .gs-st-thrust { opacity: 1; }
      /* Cockpit chrome (GS-star-tour-hud → GS-star-tour-fuel): the star map REUSES the journey bridge HUD
         (`.gs-bhud`) so it recolours to the flown ship identically and inherits the same fleet ornaments —
         see the `.gs-bhud` block below + `render/hudTheme.ts`. A `.gs-bhud--st` context modifier swaps the
         travel controls for Star Tour's own. Star Tour has NO bank/run, so there's no exit switch and no big
         golfer name plate crowding the console: the RECORDS board is baked into the top-left "STAR TOUR n/N"
         link, and the bottom console is the ship's DASHBOARD — a compact pilot-swap dot (left), the themed
         instrument deck, a NORMAL/FAST speed control (focal centre), and the live FUEL gauge (right). Star-
         Tour CONTENT keeps the `.gs-sthud__` prefix; the FRAME/theme/ornaments are the shared `.gs-bhud`
         (class-collision guard: never `.gs-hud`, the play screen's). */
      .gs-bhud--st .gs-bhud__shards { flex: 0 0 auto; font-size: 14px; font-weight: 700; white-space: nowrap; color: var(--gs-gold); }
      .gs-bhud--st .gs-bhud__shards b { color: var(--gs-gold); }
      /* The star-map console carries FIVE things — pilot · deck (the ship's fun instrument cluster) · speed ·
         WEAPON fire · fuel (GS-star-tour-weapons). The travel console floats the deck ABSOLUTELY in the left
         gap (behind the controls), which the added fire button then covered + crowded. So Star Tour instead
         lays everything out IN-FLOW in an EVEN flex row: the deck gets its OWN space between the pilot and
         speed dial (no more overlap/clipping), and the fuel gauge is slimmed to keep real breathing room. */
      .gs-bhud--st .gs-bhud__console { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 0 10px; }
      .gs-bhud--st .gs-bhud__deck {
        position: static; inset: auto; flex: 0 0 auto; overflow: visible; opacity: 1; gap: 6px;
        -webkit-mask: none; mask: none;
      }
      /* Slimmer fuel readout on Star Tour so the five-across bar isn't cramped (the count stays the hero). */
      .gs-bhud--st .gs-sthud__fuel { padding: 4px 7px; }
      .gs-bhud--st .gs-sthud__fuel .gs-fuelbar { gap: 4px; }
      .gs-bhud--st .gs-sthud__fuel .gs-fuelbar__cells { gap: 1px; padding: 2px 2px; }
      .gs-bhud--st .gs-sthud__fuel .gs-fuelbar__cell { width: 3px; height: 11px; }
      .gs-bhud--st .gs-sthud__fuel .gs-fuelbar__n { font-size: 13px; }
      .gs-bhud--st .gs-sthud__fuel .gs-fuelbar__ico { font-size: 12px; }
      /* Top-left RECORDS link — the "✦ STAR TOUR 🏆 n/N" pod is itself the records-board toggle (the
         records readout is baked in here, off the console). Reuses the `.gs-bhud__idpod` glass look; this
         just makes it a tappable button. */
      .gs-sthud__recordslink {
        cursor: pointer; font: inherit; text-align: left; appearance: none; -webkit-appearance: none;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: transform .08s ease, border-color .16s ease, filter .16s ease, box-shadow .16s ease;
      }
      .gs-sthud__recordslink:active { transform: scale(0.97); }
      .gs-sthud__recordslink:hover { filter: brightness(1.1); border-color: color-mix(in srgb, var(--hud-accent) 55%, transparent); }
      .gs-sthud__recordslink[aria-pressed="true"] { border-color: color-mix(in srgb, var(--gs-gold) 60%, transparent); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--gs-gold) 26%, transparent), 0 0 16px -5px var(--gs-gold); }
      /* LEFT slot — the pilot-swap dot (changes golfer). Small + thematic, NOT a name plate. */
      .gs-sthud__pilot {
        pointer-events: auto; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center;
        width: 44px; height: 44px; border-radius: 12px; color: var(--gs-ink);
        border: 1px solid color-mix(in srgb, var(--hud-accent) 34%, transparent);
        background: radial-gradient(120% 120% at 50% 30%, color-mix(in srgb, var(--hud-accent) 16%, #0b111c), #06090f);
        box-shadow: inset 0 1px 0 color-mix(in srgb, var(--hud-accent) 30%, transparent), inset 0 0 10px color-mix(in srgb, var(--hud-glow) 34%, transparent);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: transform .08s ease, border-color .16s ease, filter .16s ease;
      }
      .gs-sthud__pilot:active { transform: scale(0.94); }
      .gs-sthud__pilot:hover { border-color: color-mix(in srgb, var(--hud-accent) 62%, transparent); filter: brightness(1.12); }
      .gs-sthud__pilot-dot { width: 15px; height: 15px; border-radius: 999px; box-shadow: 0 0 9px currentColor; }
      .gs-sthud__pilot-swap { position: absolute; right: 3px; bottom: 1px; font-size: 9px; color: var(--hud-ink); opacity: .85; }
      /* CENTRE focal control — the cruise SPEED dial, styled like the journey scan dial (glowing round-rect
         reading the livery `--hud-*`, so each ship's speed control is its own cockpit colour). FAST glows
         hotter and rides the throttle knob UP. */
      .gs-sthud__speed {
        pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0px;
        width: 64px; height: 48px; border-radius: 13px; line-height: 1; color: var(--gs-ink);
        border: 1.5px solid color-mix(in srgb, var(--hud-accent) 62%, transparent);
        background: radial-gradient(120% 120% at 50% 26%, color-mix(in srgb, var(--hud-accent) 24%, #0b111c), #06090f);
        box-shadow: 0 0 18px -5px var(--hud-accent), inset 0 1px 0 color-mix(in srgb, var(--hud-accent) 44%, transparent), inset 0 0 12px color-mix(in srgb, var(--hud-glow) 52%, transparent);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: transform .08s ease, border-color .16s ease, filter .16s ease, box-shadow .16s ease;
      }
      .gs-sthud__speed:active { transform: scale(0.95); }
      .gs-sthud__speed:hover { filter: brightness(1.12); }
      .gs-sthud__speed--fast { border-color: color-mix(in srgb, var(--gs-warn) 72%, transparent); box-shadow: 0 0 22px -4px var(--gs-warn), inset 0 1px 0 color-mix(in srgb, var(--gs-warn) 50%, transparent), inset 0 0 13px color-mix(in srgb, var(--hud-glow) 60%, transparent); }
      .gs-sthud__speed-ico { display: flex; align-items: center; justify-content: center; }
      .gs-sthud__speed-svg { width: 16px; height: 21px; display: block; }
      .gs-sthud__speed-knob { transform-box: view-box; transition: transform .2s cubic-bezier(.3,1.4,.5,1); }
      .gs-sthud__speed--fast .gs-sthud__speed-knob { transform: translateY(-10px); fill: var(--gs-warn); }
      .gs-sthud__speed-lbl { font-size: 8px; font-weight: 800; letter-spacing: 1px; color: var(--hud-ink); margin-top: 1.5px; }
      .gs-sthud__speed--fast .gs-sthud__speed-lbl { color: var(--gs-warn); }
      .gs-sthud__speed-cost { font-size: 8px; font-weight: 700; color: var(--hud-accent); margin-top: 0.5px; }
      .gs-sthud__speed--fast .gs-sthud__speed-cost { color: var(--gs-warn); }
      /* WEAPON fire button (GS-star-tour-weapons) — a hot trigger beside the speed dial, glowing in the flown
         ship's own weapon colours (`--wpn`/`--wpn2` set inline per gun) so each craft's trigger reads as its
         own. Pressing it spits a themed projectile from the ship's nose; the ammo pips below tick down. It
         dims to `--empty` when out of charges (reload at any fuel stop). */
      .gs-sthud__fire {
        pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0px;
        width: 60px; height: 48px; border-radius: 13px; line-height: 1; color: var(--gs-ink);
        border: 1.5px solid color-mix(in srgb, var(--wpn, var(--hud-accent)) 66%, transparent);
        background: radial-gradient(120% 120% at 50% 26%, color-mix(in srgb, var(--wpn, var(--hud-accent)) 26%, #0b111c), #06090f);
        box-shadow: 0 0 18px -5px var(--wpn, var(--hud-accent)), inset 0 1px 0 color-mix(in srgb, var(--wpn, var(--hud-accent)) 44%, transparent), inset 0 0 12px color-mix(in srgb, var(--wpn2, var(--hud-glow)) 30%, transparent);
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        transition: transform .08s ease, border-color .16s ease, filter .16s ease, box-shadow .16s ease, opacity .16s ease;
      }
      .gs-sthud__fire:active { transform: scale(0.92); }
      .gs-sthud__fire:hover { filter: brightness(1.14); }
      .gs-sthud__fire-ico { display: flex; align-items: center; justify-content: center; }
      .gs-sthud__fire-svg { width: 19px; height: 19px; display: block; }
      .gs-sthud__fire-lbl { font-size: 8px; font-weight: 800; letter-spacing: 0.6px; color: var(--gs-ink); margin-top: 1px; white-space: nowrap; }
      .gs-sthud__fire-ammo { display: flex; gap: 2.5px; margin-top: 2.5px; }
      .gs-sthud__pip {
        width: 6px; height: 6px; border-radius: 999px;
        background: color-mix(in srgb, var(--wpn, var(--hud-accent)) 16%, #0b111c);
        border: 1px solid color-mix(in srgb, var(--wpn, var(--hud-accent)) 34%, transparent);
      }
      .gs-sthud__pip--on { background: var(--wpn2, var(--hud-accent)); border-color: var(--wpn, var(--hud-accent)); box-shadow: 0 0 6px var(--wpn, var(--hud-accent)); }
      /* Out of charges — the trigger dims + desaturates, but stays tappable (a soft click). */
      .gs-sthud__fire--empty { opacity: 0.5; filter: grayscale(0.5); box-shadow: none; }
      .gs-sthud__fire--empty .gs-sthud__pip { box-shadow: none; }
      /* RIGHT readout — the live FUEL gauge, recessed like the journey fuel screen (⛽ · cells · count). */
      .gs-sthud__fuel {
        pointer-events: auto; display: flex; align-items: center; max-width: 100%; overflow: hidden;
        padding: 5px 9px; border-radius: 11px;
        border: 1px solid color-mix(in srgb, var(--hud-accent) 28%, transparent);
        background: linear-gradient(180deg, rgba(4,7,12,0.66), rgba(8,11,17,0.5));
        box-shadow: inset 0 1px 4px rgba(0,0,0,0.6), inset 0 0 9px color-mix(in srgb, var(--hud-glow) 26%, transparent);
      }
      /* Zoom pair — the map's edge, mid-right, clear of the console below and the pods above. Sized
         at 44px so it clears the touch-target floor at the default UI scale (accessibility.md). */
      .gs-sthud__zoom {
        position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 7px; z-index: 2;
      }
      .gs-sthud__zoombtn {
        pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font: 600 22px/1 var(--gs-font); color: var(--hud-ink);
        border: 1px solid color-mix(in srgb, var(--hud-accent) 34%, transparent);
        background: linear-gradient(180deg, rgba(4,7,12,0.72), rgba(8,11,17,0.58));
        box-shadow: inset 0 1px 4px rgba(0,0,0,0.6), inset 0 0 9px color-mix(in srgb, var(--hud-glow) 26%, transparent);
      }
      .gs-sthud__zoombtn:hover { border-color: color-mix(in srgb, var(--hud-accent) 60%, transparent); }
      .gs-sthud__zoombtn:active { transform: translateY(1px); }
      .gs-sthud__fuel .gs-fuelbar { gap: 5px; }
      .gs-sthud__fuel .gs-fuelbar__cells { gap: 1.5px; padding: 2px 3px; }
      .gs-sthud__fuel .gs-fuelbar__cell { width: 4px; height: 12px; border-radius: 1.5px; }
      .gs-sthud__fuel .gs-fuelbar__n { font-size: 15px; }
      .gs-sthud__fuel .gs-fuelbar__ico { font-size: 13px; }
      .gs-st-hint { font-size: 12px; color: #7fa6c4; margin: 2px 0 12px; }
      /* The bottom dossier / records sheet */
      .gs-st-sheet {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; pointer-events: auto;
        max-height: 62%; overflow-y: auto; padding: 16px 16px 20px;
        background: linear-gradient(180deg, rgba(10,16,28,.92), rgba(6,10,20,.98));
        border-top: 1px solid rgba(84,200,255,.35); border-radius: 18px 18px 0 0;
        box-shadow: 0 -10px 30px rgba(0,0,0,.5); animation: gs-st-rise .22s ease;
      }
      @keyframes gs-st-rise { from { transform: translateY(28px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .gs-st-sheet__close {
        position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 999px;
        background: rgba(30,44,60,.9); border: 1px solid rgba(84,200,255,.3); color: #bfeaff; cursor: pointer; font-size: 15px;
      }
      .gs-st-sheet__head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; padding-right: 34px; }
      .gs-st-sheet__title { font: 800 20px/1.1 var(--gs-font); margin: 0; color: #eaf4ff; }
      .gs-st-tier {
        font: 700 11px/1 var(--gs-font); letter-spacing: .08em; text-transform: uppercase; color: var(--tc, #7fe0ff);
        border: 1px solid var(--tc, #7fe0ff); border-radius: 6px; padding: 3px 8px; flex: 0 0 auto;
      }
      .gs-st-sheet__blurb { font-size: 13px; color: #b9c6d8; margin: 4px 0 10px; line-height: 1.4; }
      .gs-st-rec { display: block; font-size: 13px; color: #cdd8e6; margin-bottom: 10px; }
      .gs-st-sheet__wxlabel { font: 700 10.5px/1 var(--gs-font); letter-spacing: .12em; text-transform: uppercase; color: #6f92b0; margin-bottom: 7px; }
      .gs-st-wxrow { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
      .gs-st-wx {
        background: rgba(24,36,52,.85); border: 1px solid rgba(84,200,255,.22); color: #cdd8e6;
        border-radius: 999px; padding: 6px 11px; font-size: 12px; cursor: pointer; transition: border-color .15s, background .15s;
      }
      .gs-st-wx:hover { border-color: rgba(84,200,255,.5); }
      .gs-st-wx--on { background: rgba(84,200,255,.18); border-color: #54c8ff; color: #eaf4ff; font-weight: 700; }
      .gs-st-play {
        display: block; width: 100%; padding: 13px; border-radius: 12px; cursor: pointer;
        font: 800 15px/1 var(--gs-font); color: #04121c;
        background: linear-gradient(180deg, #7fe0ff, #35a8e0); border: none;
        box-shadow: 0 4px 16px rgba(84,200,255,.35);
      }
      .gs-st-play:hover { filter: brightness(1.06); }
      .gs-st-sheet--welcome { max-height: 50%; }
      /* Shared record-board rows (star map + intro + result) */
      .gs-st-board { display: flex; flex-direction: column; gap: 3px; }
      .gs-st-boardrow {
        display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px;
        background: rgba(18,28,42,.6); font-size: 13px;
      }
      .gs-st-boardrow--you { background: rgba(84,200,255,.14); border: 1px solid rgba(84,200,255,.3); }
      .gs-st-boardrank { width: 18px; text-align: center; color: #6f92b0; font-weight: 700; }
      .gs-st-boardname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #dbe6f2; }
      .gs-st-boardscore { font-weight: 800; font-variant-numeric: tabular-nums; }
      .gs-st-boardempty { font-size: 12.5px; color: #7f93a8; padding: 8px 4px; line-height: 1.4; }
      /* Yggdrasil realm-tree overlay (GS-star-tour-yggdrasil) */
      .gs-st-sheet--ygg { border-top-color: rgba(127,224,162,.4); }
      .gs-st-realms { display: flex; flex-direction: column; gap: 8px; }
      .gs-st-realm {
        border-radius: 12px; padding: 11px 12px;
        background: rgba(18,28,42,.6); border: 1px solid rgba(127,224,162,.16);
      }
      .gs-st-realm--open { background: rgba(58,44,14,.5); border-color: rgba(255,217,122,.4); }
      .gs-st-realm--locked { opacity: .72; }
      .gs-st-realm__head { display: flex; align-items: center; gap: 8px; }
      .gs-st-realm__icon { font-size: 15px; }
      .gs-st-realm__name { flex: 1; min-width: 0; color: #eaf4ff; font-size: 14px; }
      .gs-st-realm--open .gs-st-realm__name { color: #ffe6a8; }
      .gs-st-realm__badge {
        font: 700 10px/1 var(--gs-font); letter-spacing: .08em; text-transform: uppercase;
        color: #ffd97a; border: 1px solid rgba(255,217,122,.5); border-radius: 6px; padding: 3px 7px;
      }
      .gs-st-realm__badge--soon { color: #7f93a8; border-color: rgba(127,147,168,.4); }
      .gs-st-realm__blurb { font-size: 12.5px; color: #c3d0df; margin: 7px 0 10px; line-height: 1.45; }
      .gs-st-realm--open .gs-st-play { background: linear-gradient(180deg, #ffe08a, #e0a838); box-shadow: 0 4px 16px rgba(255,210,110,.35); }
      .gs-st-realm--root { background: rgba(42,20,16,.6); border-color: rgba(255,154,107,.34); }
      .gs-st-realm--root .gs-st-realm__name { color: #ffc0a0; }
      .gs-st-realm--root .gs-st-realm__badge { color: #ff9a6b; border-color: rgba(255,154,107,.5); }
      .gs-st-introcard { margin-top: 10px; }
      .gs-st-introcard__row { display: flex; align-items: baseline; justify-content: space-between; }
      .gs-st-introcard__label { font-size: 12px; color: #8aa0b8; }
      .gs-st-introcard__score { font: 800 22px/1 var(--gs-font); font-variant-numeric: tabular-nums; }

      /* ── Star Tour round recap (strokeResult) ─────────────────────────────────── */
      .gs-strres { max-width: 460px; margin: 0 auto; padding: 6px 2px 20px; }
      .gs-strres__hero { text-align: center; padding: 16px 0 10px; }
      .gs-strres__course { font-size: 14px; color: #bcd0e6; margin-bottom: 4px; }
      .gs-strres__wx { font-size: 12px; opacity: .8; margin-left: 4px; }
      .gs-strres__score { font: 900 58px/1 var(--gs-font); font-variant-numeric: tabular-nums; text-shadow: 0 0 24px currentColor; }
      .gs-strres__sub { font-size: 13px; color: #90a2b8; margin-top: 4px; }
      .gs-strres__record {
        display: inline-block; margin-top: 10px; padding: 6px 16px; border-radius: 999px;
        font: 800 14px/1 var(--gs-font); color: #04121c; background: linear-gradient(180deg, #ffdd7a, #ffb838);
        box-shadow: 0 0 20px rgba(255,206,84,.5); animation: gs-st-rise .3s ease;
      }
      .gs-strres__prev { margin-top: 8px; font-size: 13px; color: #a8b8cc; }
      .gs-str-strip {
        display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin: 14px 0;
      }
      .gs-str-cell {
        display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0;
        border-radius: 7px; background: rgba(18,28,42,.7); border: 1px solid var(--gs-line);
      }
      .gs-str-cell__n { font-size: 9px; color: #6f8298; }
      .gs-str-cell__s { font: 800 15px/1 var(--gs-font); font-variant-numeric: tabular-nums; }
      .gs-str-cell__p { font-size: 9px; color: #6f8298; }
      .gs-strres__board { margin: 16px 0; }
      .gs-strres__boardtitle { font: 700 10.5px/1 var(--gs-font); letter-spacing: .12em; text-transform: uppercase; color: #6f92b0; margin-bottom: 8px; }
      .gs-strres__actions { display: flex; gap: 10px; margin-top: 18px; }
      .gs-strres__actions .gs-btn { flex: 1; }

      /* ── Star Tour CHAMPION select (GS-story-startour-champions) ──────────────────
         Its OWN prefix: never the play HUD's .gs-hud, and never the map's .gs-st*. */
      .gs-champ { max-width: 620px; margin: 0 auto; padding: 4px 2px 20px; }
      .gs-champ__head { text-align: center; padding: 10px 4px 14px; }
      .gs-champ__title { font: 800 22px/1.15 var(--gs-font); color: #eaf4ff; margin: 0 0 6px; }
      .gs-champ__sub { font-size: 12.5px; line-height: 1.45; color: #9db2c8; margin: 0; overflow-wrap: anywhere; }
      /* auto-fit + minmax(min(…,100%)) so the roster drops to one column on its own — a breakpoint can't
         answer "too cramped at large text" (media queries are blind to --gs-uiscale). */
      .gs-champ__grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); }
      .gs-champ__card {
        display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; text-align: left;
        padding: 10px 12px 10px 8px; border-radius: 14px; cursor: pointer;
        background: linear-gradient(180deg, rgba(20,30,46,.92), rgba(12,18,28,.92));
        border: 1px solid color-mix(in srgb, var(--pc, #7fe0ff) 40%, transparent);
        box-shadow: 0 4px 18px #0006, inset 0 0 26px color-mix(in srgb, var(--pc, #7fe0ff) 9%, transparent);
        color: #dbe6f2; font-family: var(--gs-font);
      }
      .gs-champ__card:hover { border-color: color-mix(in srgb, var(--pc, #7fe0ff) 72%, transparent); }
      .gs-champ__fig { flex: 0 0 auto; width: 76px; filter: drop-shadow(0 5px 5px #0008); }
      .gs-champ__fig svg { display: block; width: 100%; height: auto; }
      .gs-champ__meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .gs-champ__name { font-size: 16px; font-weight: 800; color: #eaf4ff; }
      .gs-champ__path {
        font: 700 10px/1.3 var(--gs-font); letter-spacing: .08em; text-transform: uppercase;
        color: var(--pc, #7fe0ff); overflow-wrap: anywhere;
      }
      .gs-champ__stats { font-size: 11.5px; line-height: 1.45; color: #93a8be; overflow-wrap: anywhere; }
      .gs-champ__actions { display: flex; margin-top: 16px; }
      .gs-champ__actions .gs-btn { flex: 1; }

      /* ── Clubhouse: tap-to-restyle character stage + garage bay + slot picker ─ */
      .gs-cstage {
        position: relative; margin: 8px auto 6px; max-width: 340px; min-height: 250px;
        border: 1px solid var(--gs-line); border-radius: var(--gs-r-lg); overflow: hidden;
        background:
          radial-gradient(115% 74% at 50% 4%, #26304e 0%, transparent 58%),
          radial-gradient(52% 30% at 50% 100%, rgba(255, 255, 255, .07), transparent 72%),
          linear-gradient(180deg, #12141d, #0b0d12);
      }
      .gs-cstage__figure { position: relative; z-index: 1; display: flex; justify-content: center; padding: 12px 0 8px; }
      .gs-cstage__figure svg { height: 232px; width: auto; filter: drop-shadow(0 7px 11px rgba(0, 0, 0, .55)); }
      /* Invisible tap band over one body part; a floating chip names the worn piece. */
      .gs-czone {
        position: absolute; left: 0; right: 0; z-index: 3; display: flex; align-items: center;
        padding: 0 10px; border: 0; background: transparent; cursor: pointer;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      }
      .gs-czone::before {
        content: ''; position: absolute; inset: 6px 28% 6px 28%;
        border: 1.6px dashed transparent; border-radius: 44px;
        transition: border-color .16s ease, background .16s ease;
      }
      .gs-czone:hover::before { border-color: #ffffff55; background: #ffffff0f; }
      .gs-czone:focus-visible { outline: none; }
      .gs-czone:focus-visible::before { border-color: var(--gs-info); }
      .gs-czone--active::before { border-color: var(--gs-warn); background: #ffc45416; }
      /* Chips zig-zag down the figure — hat-R, shirt-L, pants-R, bag-L, driver-R — so none crosses the
         face/torso centre and each slot's tap-band wraps ONLY its own body part (no band spilling over a
         neighbour's item glyph). */
      .gs-czone--hat   { top: 0%;  height: 24%; justify-content: flex-end; }
      .gs-czone--shirt { top: 24%; height: 26%; justify-content: flex-start; }
      /* Pants labels the LEGS only (not the feet): its chip rides the RIGHT edge at mid-leg height so it
         clears the body centre AND leaves the feet corners free for the bag/driver chips + item glyphs
