apply plugin: 'com.android.application'

// Release signing (GS-android). Play requires every production upload to be signed with a stable
// UPLOAD KEY. The key and its passwords never live in the repo (see android/.gitignore) — they are
// read from an untracked `android/keystore.properties`, or, in CI, from env vars populated by
// repository secrets. When neither is present the release build still runs and simply produces an
// UNSIGNED artifact, so a plain `assembleRelease` works on a clean checkout for smoke-testing.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def ksPath = keystoreProps.getProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_PATH')
def ksPassword = keystoreProps.getProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def ksAlias = keystoreProps.getProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS')
def ksAliasPassword = keystoreProps.getProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD')
def hasSigningKey = ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()

// Play rejects an upload whose versionCode is not strictly greater than the last one, so CI stamps it
// from the run number; both fall back to 1 / "1.0" locally.
//
// Computed OUT here rather than inline in `defaultConfig`, because the obvious inline form is a trap:
// Groovy parses `versionCode (expr).toInteger()` as `versionCode(expr).toInteger()` — it calls the
// setter with a STRING, then calls .toInteger() on the setter's null return, and the build dies with
// a bare "Value is null" pointing at the line. Assigning first removes the ambiguity entirely.
def buildVersionCode = Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
def buildVersionName = System.getenv('ANDROID_VERSION_NAME') ?: '1.0'

android {
    namespace = "com.foxorama.golfstars"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.foxorama.golfstars"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildVersionCode
        versionName buildVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningKey) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksAliasPassword
            }
        }
    }
    buildTypes {
        release {
            // The web bundle is already minified by Vite; there is no app Java/Kotlin worth
            // shrinking, and R8 on the Capacitor bridge only risks stripping reflected classes.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
